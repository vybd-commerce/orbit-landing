<body>
    <canvas id="c"></canvas>
    <script>
        'use strict';

        /* ------------------------------------------------------------------
         * One Order, End to End — 8s seamless hero loop for /consulting.
         *
         * Deterministic by construction: every frame is a pure function of t.
         * No requestAnimationFrame, no CSS animation, no accumulated state.
         * __renderFrame(t) may be called in any order and always paints the
         * same pixels for the same t.
         *
         * The loop closes because the state at t=0 and t=DURATION is provably
         * identical — see __computeState() and the notes on the decay front.
         * ------------------------------------------------------------------ */

        /* ── Palette ──────────────────────────────────────────────────────
         * Live site tokens from src/pages/LandingPage.css (.lp-theme-dark),
         * which every routed page applies. Alpha tokens are pre-composited
         * against the ground because canvas strokes need concrete colors.
         */
        const C = {
            ground: '#0a0a0a',   // --lp-surface
            // The site's outline tokens are authored for small borders sitting
            // next to brighter content. Composited flat they are ~0.08/0.16
            // alpha, which disappears across a whole frame of hairlines. These
            // are lifted to ~0.13/0.24 — the luminance the brief's own
            // #232A26 / #36403A carry — while keeping the site's neutral hue.
            line: '#2e2e2e',   // --lp-outline,         lifted
            lineHi: '#5c5c5c',   // --lp-outline-variant, lifted
            muted: '#6e7480',   // --lp-on-surface-muted
            flow: '#1fc8a3',   // --lp-primary
            human: '#ef7a4e',   // --lp-comparison-hiring
        };

        /* ── Master geometry ──────────────────────────────────────────────
         * Everything is authored in a 2560x1440 space and multiplied by S.
         * Each output size renders natively at this scale rather than being
         * downscaled, so hairlines stay crisp.
         */
        const MW = 2560, MH = 1440;

        /* ── Timing ───────────────────────────────────────────────────────
         * R is fixed by the beat sheet: the order sits at u=0.12 at t=0 and
         * reaches CASH (u=0.88) at t=6.6.
         */
        const DURATION = 8.0;
        const U0 = 0.12;                    // order position at t=0
        const U_CASH = 0.88;                  // CASH station arclength
        const T_CASH = 6.6;                   // when the order reaches CASH
        const R = (U_CASH - U0) / T_CASH;   // 0.115151… arclength per second

        const T_A = -U0 / R;                  // order A crossed u=0 at -1.0421s
        const T_B = T_A + DURATION;           // order B crosses u=0 at 6.9579s

        const RESOLVE = 0.4;                  // station micro-animation length
        const TRAIL = 2.5;                  // heat trail, in seconds behind the order
        const SWEEP_IN = 6.8, SWEEP_OUT = 7.4; // accelerated decay window
        const MARKER_LIFE = 1.2;              // human marker total life
        const MARKER_FADE = 0.25;             // its in/out ramps

        const STEP_T = 0.95;                  // station cadence in seconds
        const STEP_U = R * STEP_T;            // …and in arclength

        const U_QUEUE = 0.015;                // the parked "next order" tick

        /* ── Stations ─────────────────────────────────────────────────────
         * Evenly spaced back from CASH. The resulting arrival times land
         * within 0.05s of the beat sheet's MAKE 1.9 / PORT 3.8 / CASH 6.6.
         *
         * SOURCE sits at u=0.2236, ahead of the order's t=0 position of 0.12,
         * so all seven read dormant in frame 0 exactly as specified.
         */
        const STATION_W = 190, STATION_H = 136;
        const NAMES = ['SOURCE', 'MAKE', 'LOAD', 'PORT', 'DC', 'STORE', 'CASH'];
        const HUMAN = new Set(['MAKE', 'PORT', 'CASH']);

        const STATIONS = NAMES.map((name, i) => {
            const u = U_CASH - (NAMES.length - 1 - i) * STEP_U;
            return { name, u, human: HUMAN.has(name), tArrive: (u - U0) / R };
        });

        /* ── Easing ───────────────────────────────────────────────────────
         * Sharp ease-out for resolves: fast start, settle, never overshoot.
         */
        const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
        const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);
        const easeInOut = t => { t = clamp01(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
        const smoothstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
        const lerp = (a, b, t) => a + (b - a) * t;

        /* ── The path ─────────────────────────────────────────────────────
         * A gentle serpentine built as y = f(x). Parameterising by x means it
         * can never double back. Sampled once into a polyline with cumulative
         * arclength, so u maps to a point without solving anything at render
         * time.
         *
         * It spans the full frame width: u=0 is the left edge, u=1 the right.
         */
        const PATH_Y = 850, PATH_N = 1400;

        function pathY(x) {
            const p = x / MW;
            return PATH_Y
                + 150 * Math.sin(2 * Math.PI * 0.85 * p + 3.6)
                + 42 * Math.sin(2 * Math.PI * 2.10 * p + 0.8);
        }

        const PATH = (() => {
            const pts = [];
            let len = 0;
            for (let i = 0; i <= PATH_N; i++) {
                const x = (i / PATH_N) * MW;
                const y = pathY(x);
                if (i > 0) {
                    const dx = x - pts[i - 1].x, dy = y - pts[i - 1].y;
                    len += Math.hypot(dx, dy);
                }
                pts.push({ x, y, s: len });
            }
            for (const p of pts) p.u = p.s / len;
            return { pts, len };
        })();

        function posAt(u) {
            u = clamp01(u);
            const pts = PATH.pts;
            let lo = 0, hi = pts.length - 1;
            while (lo < hi - 1) {
                const mid = (lo + hi) >> 1;
                if (pts[mid].u <= u) lo = mid; else hi = mid;
            }
            const a = pts[lo], b = pts[hi];
            const span = b.u - a.u;
            const f = span > 0 ? (u - a.u) / span : 0;
            return { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f) };
        }

        /* ── State ────────────────────────────────────────────────────────
         * A pure, serialisable snapshot. The loop-closure assertion compares
         * this at t=0 and t=DURATION; the renderer draws from nothing else.
         */
        function orderU(t, entry) { return R * (t - entry); }

        /* The decay front, in arclength, for the order that entered at T_A.
         *
         * A flat 2.5s trail cannot close an 8s loop: the last segment goes hot
         * at 6.8s and would not cool until 9.3s. So the front accelerates over
         * 6.8 -> 7.4s, which is the window the beat sheet already gives to the
         * decay. It is continuous at 6.8 because the sweep starts from the
         * value the trail had already reached.
         */
        function decayFront(t, entry) {
            const trailing = clamp01(R * (t - entry - TRAIL));
            if (entry !== T_A) return trailing;
            if (t < SWEEP_IN) return trailing;
            const at68 = clamp01(R * (SWEEP_IN - entry - TRAIL));
            if (t >= SWEEP_OUT) return 1;
            return lerp(at68, 1, easeInOut((t - SWEEP_IN) / (SWEEP_OUT - SWEEP_IN)));
        }

        function bandsAt(t) {
            const out = [];
            for (const entry of [T_A, T_B]) {
                const p = clamp01(orderU(t, entry));
                const d = decayFront(t, entry);
                if (orderU(t, entry) <= 0) continue;   // not born yet
                if (d < p) out.push({ from: d, to: p });
            }
            return out;
        }

        /* Heat at a point, feathered slightly in u so a station does not pop
         * between dormant and active as the band edge crosses it. Feathering
         * in u rather than in time keeps this stateless. */
        const FEATHER = 0.018;
        function heatAt(u, bands) {
            let h = 0;
            for (const b of bands) {
                const v = Math.min(
                    smoothstep(b.from, b.from + FEATHER, u),
                    smoothstep(b.to + FEATHER, b.to, u)
                );
                if (v > h) h = v;
            }
            return h;
        }

        function computeState(t) {
            const bands = bandsAt(t);

            const orders = [];
            for (const entry of [T_A, T_B]) {
                const u = orderU(t, entry);
                if (u >= 0 && u <= 1) orders.push({ u });
            }

            // The queue tick dims out of the way while an order occupies the
            // entry. At t=0 and t=DURATION the order is at u=0.12, far clear
            // of it, so the tick is fully present in both.
            let queue = 1;
            for (const o of orders) {
                queue = Math.min(queue, smoothstep(0.02, 0.06, Math.abs(o.u - U_QUEUE)));
            }

            const stations = STATIONS.map(st => {
                const dt = t - st.tArrive;
                // Resolves are transient overlays: prog 0 and prog 1 both draw
                // nothing, so the station returns to its base form with no pop.
                const resolve = (dt >= 0 && dt <= RESOLVE) ? easeOut(dt / RESOLVE) : 0;

                let marker = 0;
                if (st.human && dt >= 0 && dt <= MARKER_LIFE) {
                    marker = Math.min(
                        smoothstep(0, MARKER_FADE, dt),
                        smoothstep(MARKER_LIFE, MARKER_LIFE - MARKER_FADE, dt)
                    );
                }

                return { name: st.name, resolve, marker, heat: heatAt(st.u, bands) };
            });

            return { t, bands, orders, queue, stations };
        }

        /* ── Canvas plumbing ──────────────────────────────────────────────── */
        const cv = document.getElementById('c');
        const ctx = cv.getContext('2d', { alpha: false });
        let S = 1;

        function setSize(w, h) {
            cv.width = w; cv.height = h;
            cv.style.width = w + 'px'; cv.style.height = h + 'px';
            S = w / MW;
        }

        const px = v => v * S;                          // curves: no snapping
        const hx = v => Math.round(v * S) + 0.5;        // orthographic: snap to a crisp hairline

        function stroke(color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width || 1;                 // a true 1px hairline at every size
            ctx.stroke();
        }

        function line(x1, y1, x2, y2, color, w) {
            ctx.beginPath();
            if (Math.abs(x1 - x2) < 0.01 || Math.abs(y1 - y2) < 0.01) {
                ctx.moveTo(hx(x1), hx(y1)); ctx.lineTo(hx(x2), hx(y2));
            } else {
                ctx.moveTo(px(x1), px(y1)); ctx.lineTo(px(x2), px(y2));
            }
            stroke(color, w);
        }

        function rect(x, y, w, h, color, lw) {
            ctx.beginPath();
            ctx.moveTo(hx(x), hx(y)); ctx.lineTo(hx(x + w), hx(y));
            ctx.lineTo(hx(x + w), hx(y + h)); ctx.lineTo(hx(x), hx(y + h));
            ctx.closePath();
            stroke(color, lw);
        }

        function fillRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)));
        }

        // Mix two hex colors — used only to fade structure between line and
        // line-hi. Never a gradient along a stroke.
        function mix(a, b, t) {
            const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
            const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
            const c = pa.map((v, i) => Math.round(lerp(v, pb[i], clamp01(t))));
            return `rgb(${c[0]},${c[1]},${c[2]})`;
        }

        /* Stroke an exact arclength range of the path, interpolating the end
         * points so the band edge moves smoothly rather than snapping to the
         * nearest sample. Hard edges, no gradient. */
        function strokeRange(u1, u2, color, w) {
            if (u2 <= u1) return;
            const pts = PATH.pts;
            ctx.beginPath();
            const a = posAt(u1);
            ctx.moveTo(px(a.x), px(a.y));
            for (const p of pts) if (p.u > u1 && p.u < u2) ctx.lineTo(px(p.x), px(p.y));
            const b = posAt(u2);
            ctx.lineTo(px(b.x), px(b.y));
            stroke(color, w);
        }

        /* ── Station vignettes ────────────────────────────────────────────
         * Orthographic, stroke-only, axis-aligned regardless of the path's
         * local angle. The box rests above the path with a short tick down to
         * it; the label sits below the path.
         *
         * Each station's resolve is a transient overlay in `flow` drawn on top
         * of static base geometry. Because the overlay is absent at both prog=0
         * and prog=1, the station returns to exactly its base form.
         */
        const TICK_GAP = 20;   // clearance between the path and the box above it

        function boxOf(st) {
            const p = posAt(st.u);
            return { x: p.x - STATION_W / 2, y: p.y - TICK_GAP - STATION_H, w: STATION_W, h: STATION_H, px: p.x, py: p.y };
        }

        /* Vignettes are authored in normalised box coordinates so the station
         * size is a single number to tune. X/Y take a fraction of the box. */
        const nc = b => ({
            X: f => b.x + f * b.w,
            Y: f => b.y + f * b.h,
        });

        const BASE = {
            // A supplier record: a document with three ruled lines.
            SOURCE(b, col) {
                const { X, Y } = nc(b);
                rect(X(0.19), Y(0.06), b.w * 0.62, b.h * 0.84, col);
                for (let i = 0; i < 3; i++) line(X(0.30), Y(0.26 + i * 0.18), X(0.70), Y(0.26 + i * 0.18), col);
            },
            // A production line: a machine block over a conveyor.
            MAKE(b, col) {
                const { X, Y } = nc(b);
                rect(X(0.13), Y(0.06), b.w * 0.74, b.h * 0.44, col);
                line(X(0.13), Y(0.68), X(0.87), Y(0.68), col);
                for (let i = 0; i < 5; i++) line(X(0.21 + i * 0.145), Y(0.68), X(0.21 + i * 0.145), Y(0.80), col);
            },
            // A container, seen side on, with its door split.
            LOAD(b, col) {
                const { X, Y } = nc(b);
                rect(X(0.08), Y(0.20), b.w * 0.84, b.h * 0.56, col);
                line(X(0.50), Y(0.20), X(0.50), Y(0.76), col);
                line(X(0.08), Y(0.32), X(0.92), Y(0.32), col);
                line(X(0.08), Y(0.64), X(0.92), Y(0.64), col);
            },
            // A quay crane: gantry beam on two legs, over the quay.
            PORT(b, col) {
                const { X, Y } = nc(b);
                line(X(0.22), Y(0.10), X(0.22), Y(0.92), col);
                line(X(0.78), Y(0.10), X(0.78), Y(0.92), col);
                line(X(0.08), Y(0.10), X(0.92), Y(0.10), col);
                line(X(0.08), Y(0.92), X(0.92), Y(0.92), col);
            },
            // Racking: two uprights, three beams.
            DC(b, col) {
                const { X, Y } = nc(b);
                line(X(0.14), Y(0.08), X(0.14), Y(0.92), col);
                line(X(0.86), Y(0.08), X(0.86), Y(0.92), col);
                for (let i = 0; i < 3; i++) line(X(0.14), Y(0.28 + i * 0.24), X(0.86), Y(0.28 + i * 0.24), col);
            },
            // A shelf with three bays, the middle one standing empty.
            STORE(b, col) {
                const { X, Y } = nc(b);
                line(X(0.08), Y(0.14), X(0.92), Y(0.14), col);
                line(X(0.08), Y(0.88), X(0.92), Y(0.88), col);
                rect(X(0.12), Y(0.56), b.w * 0.22, b.h * 0.32, col);
                rect(X(0.66), Y(0.56), b.w * 0.22, b.h * 0.32, col);
            },
            // Settlement: two facing brackets with a ledger rule between.
            CASH(b, col) {
                const { X, Y } = nc(b);
                for (const [outer, inner] of [[0.18, 0.34], [0.82, 0.66]]) {
                    ctx.beginPath();
                    ctx.moveTo(hx(X(inner)), hx(Y(0.20)));
                    ctx.lineTo(hx(X(outer)), hx(Y(0.20)));
                    ctx.lineTo(hx(X(outer)), hx(Y(0.80)));
                    ctx.lineTo(hx(X(inner)), hx(Y(0.80)));
                    stroke(col);
                }
                line(X(0.36), Y(0.50), X(0.64), Y(0.50), col);
            },
        };

        /* Every resolve is a transient overlay in `flow` over static base
         * geometry. It draws nothing at p=0 and nothing at p=1, so the station
         * always returns to exactly its base form — no pop, and nothing to
         * unwind at the loop wrap. */
        const RESOLVES = {
            // A PO confirming: a check draws on, then clears.
            SOURCE(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = p > 0.7 ? clamp01(1 - (p - 0.7) / 0.3) : 1;
                const draw = clamp01(p / 0.5);
                const k = [[X(0.32), Y(0.54)], [X(0.44), Y(0.70)], [X(0.70), Y(0.30)]];
                const s1 = Math.min(draw / 0.4, 1), s2 = clamp01((draw - 0.4) / 0.6);
                ctx.beginPath();
                ctx.moveTo(px(k[0][0]), px(k[0][1]));
                ctx.lineTo(px(lerp(k[0][0], k[1][0], s1)), px(lerp(k[0][1], k[1][1], s1)));
                if (s2 > 0) ctx.lineTo(px(lerp(k[1][0], k[2][0], s2)), px(lerp(k[1][1], k[2][1], s2)));
                stroke(C.flow, 2.5);
                ctx.globalAlpha = 1;
            },
            // One pass of the line: a bar sweeps through, a unit is emitted.
            MAKE(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = Math.min(smoothstep(0, 0.12, p), smoothstep(1, 0.88, p));
                const x = lerp(X(0.15), X(0.85), p);
                line(x, Y(0.10), x, Y(0.46), C.flow, 2.5);
                if (p > 0.45) {
                    const e = clamp01((p - 0.45) / 0.55);
                    fillRect(lerp(X(0.70), X(0.92), e) - b.w * 0.035, Y(0.62), b.w * 0.07, b.w * 0.07, C.flow);
                }
                ctx.globalAlpha = 1;
            },
            // Doors closing, then the seal snapping across.
            LOAD(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = p > 0.85 ? clamp01(1 - (p - 0.85) / 0.15) : 1;
                const shut = easeOut(clamp01(p / 0.6));
                const lx = lerp(X(0.14), X(0.47), shut), rx = lerp(X(0.86), X(0.53), shut);
                line(lx, Y(0.22), lx, Y(0.74), C.flow, 2.5);
                line(rx, Y(0.22), rx, Y(0.74), C.flow, 2.5);
                if (p > 0.6) {
                    const s = clamp01((p - 0.6) / 0.25);
                    line(X(0.40), Y(0.48), lerp(X(0.40), X(0.60), s), Y(0.48), C.flow, 2.5);
                }
                ctx.globalAlpha = 1;
            },
            // The spreader drops, takes the box, lifts it clear.
            PORT(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = p > 0.8 ? clamp01(1 - (p - 0.8) / 0.2) : 1;
                const down = easeOut(clamp01(p / 0.4));
                const up = easeOut(clamp01((p - 0.4) / 0.4));
                const y = p < 0.4 ? lerp(Y(0.14), Y(0.70), down) : lerp(Y(0.70), Y(0.22), up);
                line(X(0.50), Y(0.10), X(0.50), y, C.flow, 1.5);
                line(X(0.36), y, X(0.64), y, C.flow, 2.5);
                if (p >= 0.4) rect(X(0.39), y + b.h * 0.03, b.w * 0.22, b.h * 0.16, C.flow, 2);
                ctx.globalAlpha = 1;
            },
            // A pallet breaking into cases.
            DC(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = Math.min(smoothstep(0, 0.1, p), smoothstep(1, 0.82, p));
                const cx = X(0.50), cy = Y(0.50);
                if (p < 0.35) {
                    rect(cx - b.w * 0.17, cy - b.h * 0.13, b.w * 0.34, b.h * 0.26, C.flow, 2.5);
                } else {
                    const f = easeOut(clamp01((p - 0.35) / 0.65));
                    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
                        rect(cx + dx * lerp(b.w * 0.085, b.w * 0.20, f) - b.w * 0.07,
                            cy + dy * lerp(b.h * 0.065, b.h * 0.15, f) - b.h * 0.055,
                            b.w * 0.14, b.h * 0.11, C.flow, 2);
                    }
                }
                ctx.globalAlpha = 1;
            },
            // A case slotting into the empty bay.
            STORE(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = p > 0.6 ? clamp01(1 - (p - 0.6) / 0.4) : 1;
                const slide = easeOut(clamp01(p / 0.6));
                rect(lerp(X(1.02), X(0.39), slide), Y(0.56), b.w * 0.22, b.h * 0.32, C.flow, 2.5);
                ctx.globalAlpha = 1;
            },
            // The brackets close and the ledger line completes.
            CASH(b, p) {
                const { X, Y } = nc(b);
                ctx.globalAlpha = p > 0.8 ? clamp01(1 - (p - 0.8) / 0.2) : 1;
                const close = easeOut(clamp01(p / 0.5));
                const lx = lerp(X(0.18), X(0.38), close), rx = lerp(X(0.82), X(0.62), close);
                line(lx, Y(0.24), lx, Y(0.76), C.flow, 2.5);
                line(rx, Y(0.24), rx, Y(0.76), C.flow, 2.5);
                if (p > 0.5) {
                    const d = clamp01((p - 0.5) / 0.3);
                    line(lx, Y(0.50), lerp(lx, rx, d), Y(0.50), C.flow, 2.5);
                }
                ctx.globalAlpha = 1;
            },
        };

        /* ── Render ───────────────────────────────────────────────────────── */
        /* Sizes the brief specifies literally (8px order, 6px ring, 10-11px
         * labels) were authored for a smaller canvas — at 2560 they vanish at
         * playback size, and the brief also asks the piece to read at 25%.
         * These are the smallest values that survive both. */
        const LABEL_SIZE = 24;   // ~18px at 1920
        const ORDER_SIZE = 13;   // the protagonist; 8 disappears at 1280
        const QUEUE_SIZE = 11;
        const RING_R = 11;

        function renderFrame(t) {
            const st = computeState(t);

            ctx.fillStyle = C.ground;
            ctx.fillRect(0, 0, cv.width, cv.height);
            ctx.lineCap = 'butt';
            ctx.lineJoin = 'miter';

            // Dormant path, then the hot bands over it.
            strokeRange(0, 1, C.line, 1);
            for (const b of st.bands) strokeRange(b.from, b.to, C.lineHi, 1);

            // The parked next order, waiting at the entry.
            if (st.queue > 0.01) {
                const q = posAt(U_QUEUE);
                ctx.globalAlpha = st.queue * 0.75;
                fillRect(q.x - QUEUE_SIZE / 2, q.y - QUEUE_SIZE / 2, QUEUE_SIZE, QUEUE_SIZE, C.muted);
                ctx.globalAlpha = 1;
            }

            ctx.font = `500 ${px(LABEL_SIZE)}px "Plex Mono", monospace`;
            ctx.letterSpacing = `${px(LABEL_SIZE * 0.12)}px`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            for (let i = 0; i < STATIONS.length; i++) {
                const s = STATIONS[i], v = st.stations[i], b = boxOf(s);
                const col = mix(C.line, C.lineHi, v.heat);

                line(b.px, b.py, b.px, b.y + b.h, col);          // tick from path up to the box
                BASE[s.name](b, col);
                if (v.resolve > 0) RESOLVES[s.name](b, v.resolve);

                // The human marker: a ring, never a filled dot, on a short
                // tick above the station. The only warm colour in the frame.
                if (v.marker > 0.01) {
                    ctx.globalAlpha = v.marker;
                    line(b.px, b.y - 8, b.px, b.y - 30, C.human);
                    ctx.beginPath();
                    ctx.arc(px(b.px), px(b.y - 30 - RING_R), px(RING_R), 0, Math.PI * 2);
                    stroke(C.human, 2);
                    ctx.globalAlpha = 1;
                }

                ctx.fillStyle = C.muted;
                ctx.fillText(s.name, px(b.px), px(b.py + 30));
            }

            // The order itself. Constant rate — the one mechanical thing here.
            for (const o of st.orders) {
                const p = posAt(o.u);
                fillRect(p.x - ORDER_SIZE / 2, p.y - ORDER_SIZE / 2, ORDER_SIZE, ORDER_SIZE, C.flow);
            }
        }

        /* ── Exposed surface ──────────────────────────────────────────────── */
        setSize(MW, MH);

        window.__DURATION = DURATION;
        window.__FPS = 60;
        window.__setSize = setSize;
        window.__renderFrame = renderFrame;
        window.__computeState = computeState;
        window.__exportWebp = (q) => cv.toDataURL('image/webp', q === undefined ? 0.92 : q);
        window.__ready = document.fonts.load(`500 20px "Plex Mono"`).then(() => document.fonts.ready);

        renderFrame(0);
    </script>
</body>

</html>
