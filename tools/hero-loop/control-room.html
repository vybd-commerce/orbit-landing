<body>
    <canvas id="c"></canvas>
    <script>
        'use strict';

        /* ------------------------------------------------------------------
         * The Control Room — 9s seamless hero loop for /consulting.
         *
         * A dense operational instrument panel that gets RESOLVED, not
         * SIMPLIFIED. When the layer engages the panel does not get emptier,
         * calmer or more minimal. It stays exactly as dense. What changes is
         * that the noise resolves into the small number of things that
         * genuinely need a person.
         *
         * Density is the honest picture of an operation. Emptiness is a lie.
         *
         * Deterministic by construction: every frame is a pure function of t.
         * No requestAnimationFrame, no CSS animation, no accumulated state.
         * __renderFrame(t) may be called in any order and always paints the
         * same pixels for the same t.
         *
         * The loop closes because every time-varying quantity is periodic in
         * t with period exactly DURATION — as arithmetic, not as a modulo.
         * See "Why the loop closes" in README.md.
         * ------------------------------------------------------------------ */

        /* ── Palette ──────────────────────────────────────────────────────
         * The brief's eight hexes, used literally. These are NOT the live
         * site tokens (see README "Deviations"). Note the deliberate
         * collapse: `open` and `human` are the same amber. The layer does not
         * eliminate the amber, it reduces it to the amber that should be
         * there.
         */
        const C = {
            ground: '#0A0C0B',   // page black, very slightly green-biased
            raised: '#121614',   // tile fill
            line: '#232A26',   // tile borders, dormant
            lineHi: '#36403A',   // active structure — and the sweep band
            text: '#E9EFEB',
            muted: '#8B9791',
            flow: '#34CE8A',   // resolved / healthy / handled
            open: '#E9A23B',   // an open exception — unresolved work
            human: '#E9A23B',   // the same amber, for the few that stay human
        };

        /* ── Timing ───────────────────────────────────────────────────────── */
        const MW = 2560, MH = 1440;
        const DURATION = 9.0;
        const FPS = 60;
        const TAU = Math.PI * 2;

        const T_BUILD_END = 3.2;   // load has finished building
        const T_SWEEP_IN = 3.2;   // the layer engages
        const T_SWEEP_OUT = 4.6;   // …and has crossed the full panel
        const T_SETTLE = 6.4;   // counter has finished falling
        const T_TAIL = 8.2;   // new work starts arriving

        const RISE = 0.34;  // amber ramp-on
        const FALL = 0.25;  // resolution ramp-off, per the brief
        const CONTACT = 0.30;  // how long a tile's border stays lifted after contact

        /* The breathe is optional in the brief and is off by default. At
         * 1.015 it makes every snapped hairline crawl by a fraction of a
         * pixel for nine seconds, which shimmers on flat near-black and costs
         * real bitrate for motion nobody consciously sees. Set to 0.015 to
         * enable; the curve has zero value AND zero derivative at both ends,
         * so the wrap stays clean either way. */
        const BREATHE = 0.0;

        /* ── Small maths ──────────────────────────────────────────────────── */
        const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
        const lerp = (a, b, t) => a + (b - a) * t;
        const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);
        const smoothstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
        // Zero first derivative at both ends — the counter uses this so its
        // rate of change is 0 exactly at the wrap.
        const smoother = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); };
        // A ramp that reaches 1 in `d` seconds and stays there. Used for every
        // state transition so a transition is a pure function of (t - onset).
        const ramp = (age, d) => age <= 0 ? 0 : easeOut(age / d);
        // A transient bump: 0 at age<=0 and 0 again at age>=d. Anything drawn
        // through this is absent at both ends of the loop by construction.
        const bump = (age, d) => (age <= 0 || age >= d) ? 0 : Math.sin(Math.PI * (age / d));

        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        /* Seeded wobble. Every harmonic is an integer multiple of the loop
         * frequency, so this is periodic in t with period exactly DURATION —
         * the reason jitter can be continuous without breaking the wrap. A
         * per-frame RNG could never close the loop. */
        function wob(seed, t, harmonics) {
            const n = harmonics || 3;
            let v = 0, w = 0;
            for (let m = 1; m <= n; m++) {
                const a = 1 / m;
                v += a * Math.sin(TAU * m * t / DURATION + seed * m * 2.3999632 + m * 1.7);
                w += a;
            }
            return v / w;                                // roughly -1..1
        }

        /* ── Panel layout ─────────────────────────────────────────────────
         * Generated once, from a fixed seed, and then frozen. Geometry NEVER
         * varies with t. That is what makes the brief's load-bearing
         * constraint — same tile count and same total tile area before and
         * after the layer engages — true by construction rather than by luck.
         * Gate 5 asserts it anyway, so it fails loudly the day someone makes
         * a tile animate its size.
         */
        const PAD_X = 132;
        const ZONE_GAP = 36;
        const ZONE_W = (MW - 2 * PAD_X - 4 * ZONE_GAP) / 5;   // 424
        const PANEL_TOP = 430;
        const PANEL_BOT = 1292;
        const PANEL_H = PANEL_BOT - PANEL_TOP;
        const ROW_GAP = 20;
        const COL_GAP = 22;
        const ZONE_LABEL_Y = 392;

        /* The brief's literal sizes were authored for a smaller canvas. At
         * 2560 a 9px label and a 6px marker vanish at 1280 playback, so they
         * are scaled up by the same factor the first loop used (~1.6–2×) —
         * the smallest values that survive both 1280 playback and the brief's
         * own "reads at 25%" check. Recorded in README "Deviations". */
        const LABEL_ZONE = 22;   // zone headers      (brief: 10px)
        const LABEL_TILE = 17;   // in-tile labels    (brief: 9px)
        const CODE_SIZE = 19;   // status codes
        const FIG_SIZE = 40;   // in-tile counters
        const HERO_LABEL = 24;   // OPEN EXCEPTIONS
        const HERO_FIG = 132;  // the one number meant to be read
        const CHIP = 11;   // status square     (brief: 6px)
        const RING_R = 11;   // human marker      (brief: 6px)
        const SWEEP_W = 62;   // sweep band        (brief: 40px)
        const TRACK = 0.1;  // letter-spacing, em
        const PAD_IN = 14;   // tile inner padding

        // 61 tiles. Each zone gets its own type mix so it has its own texture;
        // TRANSPORT is visibly the densest.
        const ZONE_SPEC = [
            { name: 'SOURCING', n: 12, mix: { chip: 4, counter: 3, bar: 2, spark: 2, gauge: 1 }, split: 0.70 },
            { name: 'MANUFACTURING', n: 12, mix: { gauge: 3, bar: 4, counter: 2, spark: 2, chip: 1 }, split: 0.66 },
            { name: 'WAREHOUSING', n: 11, mix: { bar: 4, counter: 3, chip: 2, spark: 2 }, split: 0.62 },
            { name: 'DISTRIBUTION', n: 12, mix: { spark: 4, chip: 4, counter: 2, bar: 2 }, split: 0.74 },
            { name: 'TRANSPORT', n: 14, mix: { spark: 6, chip: 4, bar: 2, counter: 1, gauge: 1 }, split: 0.86 },
        ];

        const CODE_PREFIX = ['PO', 'CTR', 'SKU', 'BOL', 'ASN', 'LOT', 'WO', 'TRK', 'DO', 'INV'];
        const TILE_LABELS = {
            spark: ['THROUGHPUT', 'DWELL', 'CYCLE T', 'VARIANCE', 'LEAD TIME', 'YIELD', 'TRANSIT', 'SCAN RATE', 'LOAD FACTOR'],
            counter: ['IN QUEUE', 'OPEN PO', 'BACKLOG', 'UNITS', 'PENDING', 'AWAITING', 'ON HAND', 'IN TRANSIT'],
            bar: ['UTILISATION', 'ALLOCATION', 'CAPACITY', 'SPLIT', 'BY LANE', 'BY SITE'],
            gauge: ['OEE', 'FILL RATE', 'OTIF', 'ACCURACY', 'UPTIME'],
            chip: ['EXCEPTIONS', 'HOLDS', 'FLAGGED', 'REVIEW', 'OPEN ITEMS'],
        };

        const TILES = (() => {
            const rnd = mulberry32(0x0C0FFEE1);
            const out = [];

            ZONE_SPEC.forEach((zs, zi) => {
                const zx = PAD_X + zi * (ZONE_W + ZONE_GAP);

                // Types: expand the mix, then shuffle deterministically.
                const types = [];
                for (const k of Object.keys(zs.mix)) for (let i = 0; i < zs.mix[k]; i++) types.push(k);
                for (let i = types.length - 1; i > 0; i--) {
                    const j = Math.floor(rnd() * (i + 1));
                    [types[i], types[j]] = [types[j], types[i]];
                }

                // Rows: either one full-width tile or two half-width ones, so
                // the grid reads as a real panel rather than a wireframe.
                const rows = [];
                let left = zs.n;
                while (left > 0) {
                    const two = left >= 2 && rnd() < zs.split;
                    rows.push(two ? 2 : 1);
                    left -= two ? 2 : 1;
                }

                // Heights vary, then normalise so the zone fills the panel
                // exactly. Total tile area is therefore fixed at build time.
                const weights = rows.map(() => 0.85 + rnd() * 0.30);
                const wsum = weights.reduce((a, b) => a + b, 0);
                const avail = PANEL_H - ROW_GAP * (rows.length - 1);

                let y = PANEL_TOP, ti = 0;
                rows.forEach((cols, ri) => {
                    const h = avail * weights[ri] / wsum;
                    for (let c = 0; c < cols; c++) {
                        const w = cols === 1 ? ZONE_W : (ZONE_W - COL_GAP) / 2;
                        const x = cols === 1 ? zx : zx + c * (w + COL_GAP);
                        const type = types[ti];
                        out.push({
                            zone: zi, zoneName: zs.name, row: ri, type,
                            x, y, w, h,
                            cx: x + w / 2, cy: y + h / 2,
                            label: TILE_LABELS[type][Math.floor(rnd() * TILE_LABELS[type].length)],
                            // Per-tile seeds. Drawn once here so the wobble
                            // phases are fixed for the life of the piece.
                            seed: rnd() * 1000,
                            ph: Array.from({ length: 24 }, () => rnd() * 1000),
                            npts: 12 + Math.floor(rnd() * 9),          // sparkline: 12–20 points
                            nbars: 4 + Math.floor(rnd() * 3),          // bar row: 4–6 bars
                            // As many code rows as the tile is tall enough to
                            // hold, up to four, occasionally one fewer for
                            // texture. Driving this from height rather than
                            // from the dice does two things: a short tile never
                            // stacks its codes on top of each other, and a tall
                            // one is never left half empty.
                            nchips: Math.max(1, Math.min(4,
                                Math.floor((h - PAD_IN * 2 - LABEL_TILE - 12) / (CODE_SIZE * 1.6))
                                - (rnd() < 0.25 ? 1 : 0))),
                            codes: Array.from({ length: 4 }, () =>
                                CODE_PREFIX[Math.floor(rnd() * CODE_PREFIX.length)] + '-' +
                                String(1000 + Math.floor(rnd() * 8999))),
                        });
                        ti++;
                    }
                    y += h + ROW_GAP;
                });
            });

            return out;
        })();

        const N_TILES = TILES.length;
        const PANEL_L = PAD_X;
        const PANEL_R = MW - PAD_X;

        /* ── Who is amber, and when ───────────────────────────────────────
         * One onset time `b` per tile drives the whole load story.
         *
         *   b <= 0   the tile went amber during the PREVIOUS loop's tail, so
         *            it is already amber at frame 0. ~30% of tiles.
         *   0 < b    it goes amber during the build. Another ~15%, taking the
         *            panel to ~45% amber by the time the layer engages.
         *   b = Inf  it never goes amber this loop.
         *
         * A tile turns amber again at b + DURATION. For the b <= 0 group that
         * lands inside the tail beat, and at t = DURATION its amber age is
         * exactly -b, which is its amber age at t = 0. That identity is the
         * whole reason the loop closes.
         *
         * Three tiles — one each in SOURCING, DISTRIBUTION and TRANSPORT —
         * are amber for the entire loop. Those are the decisions that stay
         * human. They are the only tiles the sweep does not resolve.
         */
        const HUMAN_TILES = (() => {
            const pick = (zi) => {
                // A half-width tile in the middle third of the zone reads best.
                const cand = TILES.filter(t => t.zone === zi && t.w < ZONE_W - 1 &&
                    t.cy > PANEL_TOP + PANEL_H * 0.28 && t.cy < PANEL_TOP + PANEL_H * 0.72);
                const list = cand.length ? cand : TILES.filter(t => t.zone === zi);
                return TILES.indexOf(list[Math.floor(list.length / 2)]);
            };
            return [pick(0), pick(3), pick(4)];
        })();

        const LOAD = (() => {
            const rnd = mulberry32(0x51DE0007);
            const humans = new Set(HUMAN_TILES);

            // Edge-first ordering for the tail beat: new work "reappears at
            // the edges and begins spreading", so the tiles furthest from the
            // centre re-arm first.
            const order = TILES.map((t, i) => i)
                .filter(i => !humans.has(i))
                .map(i => ({ i, edge: Math.abs(TILES[i].cx - MW / 2) / (MW / 2), k: rnd() }))
                .sort((a, b) => (b.edge - a.edge) || (a.k - b.k));

            const nEarly = Math.round(N_TILES * 0.30) - humans.size;   // already amber at frame 0
            const nBuild = Math.round(N_TILES * 0.15);                 // arrive during the build

            const b = new Array(N_TILES).fill(Infinity);
            for (const idx of humans) b[idx] = -Infinity;              // amber always; see amberAt()

            order.forEach((o, k) => {
                if (k < nEarly) {
                    // Spread across the tail so the arrival staggers. The
                    // window is chosen so the first onset lands exactly on
                    // T_TAIL and the last ramp COMPLETES before the wrap: every
                    // one of them is fully amber and momentarily still at frame
                    // 0, which is both what the poster needs and what keeps the
                    // wrap free of residual motion.
                    b[o.i] = (T_TAIL - DURATION) + 0.34 * (k / Math.max(1, nEarly - 1));
                } else if (k < nEarly + nBuild) {
                    const u = (k - nEarly) / Math.max(1, nBuild - 1);
                    b[o.i] = 0.35 + u * (T_BUILD_END - 0.75);
                }
            });
            return b;
        })();

        // When the sweep reaches a tile. Constant rate across the panel.
        const SWEEP_AT = TILES.map(t =>
            T_SWEEP_IN + (T_SWEEP_OUT - T_SWEEP_IN) * clamp01((t.cx - PANEL_L) / (PANEL_R - PANEL_L)));

        /* How amber a tile is, 0..1, at time t. */
        function amberAt(i, t) {
            if (LOAD[i] === -Infinity) return 1;              // stays human, always amber
            if (LOAD[i] === Infinity) return 0;
            const b = LOAD[i];
            const on = ramp(t - b, RISE);                     // this loop's onset
            const onNext = ramp(t - (b + DURATION), RISE);    // the next loop's, during the tail
            const off = ramp(t - SWEEP_AT[i], FALL);          // resolved by the layer
            return clamp01(Math.max(on - off, onNext));
        }

        /* ── The one number meant to be read ─────────────────────────────── */
        const EX_LOW = 3;    // what is left when only the human decisions remain
        const EX_BASE = 41;   // frame 0 — a working panel under load
        const EX_PEAK = 68;   // by the time the layer engages

        function exceptionsAt(t) {
            if (t < T_SWEEP_OUT) {
                // Climbs through the build and keeps climbing a little while
                // the sweep crosses — the work does not stop arriving because
                // someone started handling it.
                const a = EX_BASE + (EX_PEAK - 4 - EX_BASE) * smoother(0, T_BUILD_END, t);
                return a + 4 * smoothstep(T_BUILD_END, T_SWEEP_OUT, t);
            }
            if (t < T_SETTLE) return lerp(EX_PEAK, EX_LOW, smoothstep(T_SWEEP_OUT, T_SETTLE, t));
            if (t < T_TAIL) return EX_LOW;
            // Back to exactly EX_BASE at t = DURATION, with zero rate of change
            // at the wrap so the counter does not appear to jump the seam.
            return lerp(EX_LOW, EX_BASE, smoother(T_TAIL, DURATION, t));
        }

        /* ── State ────────────────────────────────────────────────────────
         * A complete description of the frame as plain data. Gate 1 walks
         * this at t=0 and t=DURATION and requires every float to match to
         * 1e-9. Anything the renderer reads that is not in here is a bug.
         */
        function computeState(t) {
            // sweepP is reported as 0 outside the sweep rather than left
            // clamped at 1 — it is inert then, and a state field that holds a
            // different value at t=0 and t=DURATION fails gate 1 on principle
            // even when nothing reads it.
            const sweepOn = t > T_SWEEP_IN && t < T_SWEEP_OUT;
            const sweepP = sweepOn ? clamp01((t - T_SWEEP_IN) / (T_SWEEP_OUT - T_SWEEP_IN)) : 0;
            const humanRing = smoothstep(T_SWEEP_OUT, T_SWEEP_OUT + 0.4, t) * (1 - smoother(T_TAIL, DURATION, t));

            const tiles = TILES.map((tile, i) => {
                const a = amberAt(i, t);
                // Jitter amplitude is driven by load: busier tiles move more,
                // and damp to a steady low amplitude once resolved.
                const amp = 0.34 + 0.66 * a;
                const series = [];
                if (tile.type === 'spark') {
                    for (let k = 0; k < tile.npts; k++) series.push(wob(tile.ph[k % 24] + k * 3.7, t, 3) * amp);
                } else if (tile.type === 'bar') {
                    for (let k = 0; k < tile.nbars; k++) series.push(0.5 + 0.34 * wob(tile.ph[k] + 11.3, t, 2) * amp);
                } else if (tile.type === 'gauge') {
                    series.push(0.52 + 0.30 * wob(tile.seed, t, 2) * amp);
                } else if (tile.type === 'counter') {
                    series.push(Math.round(40 + 360 * (0.5 + 0.5 * wob(tile.seed, t, 2)) + 80 * a));
                } else {
                    for (let k = 0; k < tile.nchips; k++) series.push(0.5 + 0.5 * wob(tile.ph[k] + 5.1, t, 2));
                }
                return {
                    w: tile.w, h: tile.h,                    // gate 5 reads these
                    a,
                    contact: bump(t - SWEEP_AT[i], CONTACT), // transient border lift as the band passes
                    human: LOAD[i] === -Infinity ? 1 : 0,
                    series,
                };
            });

            return {
                t,
                sweepP, sweepOn: sweepOn ? 1 : 0,
                humanRing,
                exceptions: exceptionsAt(t),
                breathe: 1 + BREATHE * (1 - Math.cos(TAU * t / DURATION)) / 2,
                tiles,
            };
        }

        /* ── Canvas plumbing ──────────────────────────────────────────────── */
        const cv = document.getElementById('c');
        const ctx = cv.getContext('2d', { alpha: false });
        let S = 1;

        function setSize(w, h) {
            cv.width = w; cv.height = h;
            cv.style.width = w + 'px'; cv.style.height = h + 'px';
            S = w / MW;
        }

        const px = v => v * S;                          // curves: no snapping
        const hx = v => Math.round(v * S) + 0.5;        // orthographic: snap to a crisp hairline

        function stroke(color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width || 1;                 // a true 1px hairline at every size
            ctx.stroke();
        }

        function line(x1, y1, x2, y2, color, w) {
            ctx.beginPath();
            if (Math.abs(x1 - x2) < 0.01 || Math.abs(y1 - y2) < 0.01) {
                ctx.moveTo(hx(x1), hx(y1)); ctx.lineTo(hx(x2), hx(y2));
            } else {
                ctx.moveTo(px(x1), px(y1)); ctx.lineTo(px(x2), px(y2));
            }
            stroke(color, w);
        }

        function rect(x, y, w, h, color, lw) {
            ctx.beginPath();
            ctx.moveTo(hx(x), hx(y)); ctx.lineTo(hx(x + w), hx(y));
            ctx.lineTo(hx(x + w), hx(y + h)); ctx.lineTo(hx(x), hx(y + h));
            ctx.closePath();
            stroke(color, lw);
        }

        function fillRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.round(x * S), Math.round(y * S),
                Math.max(1, Math.round(w * S)), Math.max(1, Math.round(h * S)));
        }

        // Mix two hex colors. Used for the amber -> flow state change and to
        // lift structure between line and line-hi. Never a gradient along a
        // stroke.
        function mix(a, b, t) {
            const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
            const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
            const c = pa.map((v, i) => Math.round(lerp(v, pb[i], clamp01(t))));
            return `rgb(${c[0]},${c[1]},${c[2]})`;
        }

        function text(str, x, y, size, color, align) {
            ctx.font = `500 ${Math.max(6, px(size))}px "Plex Mono"`;
            ctx.letterSpacing = (px(size) * TRACK).toFixed(2) + 'px';
            ctx.fillStyle = color;
            ctx.textAlign = align || 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(str, px(x), px(y));
            ctx.letterSpacing = '0px';
        }

        /* ── Tile types ───────────────────────────────────────────────────
         * All five are stroke-and-fill instruments. No glow, no bloom, no
         * scanlines, no CRT. This is an instrument panel, not a sci-fi prop.
         * `tone` is the tile's data colour — flow when handled, open when it
         * is an exception, interpolated while it changes.
         */
        function drawSpark(tl, st, tone) {
            const x0 = tl.x + PAD_IN, x1 = tl.x + tl.w - PAD_IN;
            const top = tl.y + PAD_IN + LABEL_TILE + 10, bot = tl.y + tl.h - PAD_IN;
            const midY = (top + bot) / 2, half = (bot - top) / 2;
            const n = st.series.length;
            ctx.beginPath();
            for (let k = 0; k < n; k++) {
                const X = px(lerp(x0, x1, k / (n - 1)));
                const Y = px(midY - st.series[k] * half * 0.86);
                k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
            }
            stroke(tone, 1);
        }

        function drawBars(tl, st, tone) {
            const x0 = tl.x + PAD_IN, w = tl.w - PAD_IN * 2;
            const top = tl.y + PAD_IN + LABEL_TILE + 12;
            const avail = tl.y + tl.h - PAD_IN - top;
            const n = st.series.length;
            const bh = Math.min(9, avail / (n * 1.9));
            const gap = (avail - bh * n) / Math.max(1, n - 1);
            for (let k = 0; k < n; k++) {
                const y = top + k * (bh + gap);
                fillRect(x0, y, w, bh, C.line);
                fillRect(x0, y, w * clamp01(st.series[k]), bh, tone);
            }
        }

        function drawGauge(tl, st, tone) {
            const cx = tl.cx, cy = tl.y + tl.h - PAD_IN - 6;
            const r = Math.min(tl.w * 0.30, (tl.h - LABEL_TILE - PAD_IN * 2) * 0.86);
            ctx.beginPath(); ctx.arc(px(cx), px(cy), px(r), Math.PI, TAU); stroke(C.line, 1);
            const v = clamp01(st.series[0]);
            ctx.beginPath(); ctx.arc(px(cx), px(cy), px(r), Math.PI, Math.PI + Math.PI * v); stroke(tone, 1);
            const ang = Math.PI + Math.PI * v;
            ctx.beginPath();
            ctx.moveTo(px(cx + Math.cos(ang) * (r - 9)), px(cy + Math.sin(ang) * (r - 9)));
            ctx.lineTo(px(cx + Math.cos(ang) * (r + 7)), px(cy + Math.sin(ang) * (r + 7)));
            stroke(tone, 1);
        }

        function drawCounter(tl, st, tone) {
            text(String(st.series[0]), tl.x + PAD_IN, tl.y + tl.h - PAD_IN - 4, FIG_SIZE, tone);
        }

        function drawChips(tl, st, tone) {
            const x0 = tl.x + PAD_IN;
            const top = tl.y + PAD_IN + LABEL_TILE + 12;
            const avail = tl.y + tl.h - PAD_IN - top;
            const n = st.series.length;
            const step = avail / n;
            for (let k = 0; k < n; k++) {
                const y = top + k * step + (step - CHIP) / 2;
                // The chip is lit when its own reading is high; the tile's
                // tone still carries whether this is an exception or handled.
                fillRect(x0, y, CHIP, CHIP, st.series[k] > 0.5 ? tone : C.line);
                text(tl.codes[k % tl.codes.length], x0 + CHIP + 9, y + CHIP, CODE_SIZE, C.muted);
            }
        }

        const DRAW = { spark: drawSpark, bar: drawBars, gauge: drawGauge, counter: drawCounter, chip: drawChips };

        /* ── The one number ───────────────────────────────────────────────
         * An odometer. Each wheel carries only as its own decade turns over,
         * so the digits roll — they never blur and they never slot-machine.
         */
        function drawOdometer(value, cx, baseY, size) {
            ctx.font = `500 ${Math.max(6, px(size))}px "Plex Mono"`;
            const digits = String(Math.max(0, Math.floor(value))).length;
            const dw = ctx.measureText('0').width / S;          // Plex Mono: every digit the same width
            const total = dw * digits;
            const h = size * 1.06;

            for (let p = 0; p < digits; p++) {
                const pow = Math.pow(10, digits - 1 - p);
                const u = value / pow;
                const d = Math.floor(u) % 10;
                const f = u - Math.floor(u);
                const roll = smoothstep(0.86, 1.0, f);          // carry only at the turnover
                const x = cx - total / 2 + p * dw;

                // The window is one digit cell — cap height above the
                // baseline, a hair below it. Anything taller and both the
                // outgoing and the incoming digit are fully legible at once,
                // which reads as two numbers rather than one rolling.
                ctx.save();
                ctx.beginPath();
                ctx.rect(px(x) - 1, px(baseY - size * 0.76), px(dw) + 2, px(size * 0.82));
                ctx.clip();
                text(String(d), x, baseY + roll * h, size, C.text);
                if (roll > 0) text(String((d + 1) % 10), x, baseY - (1 - roll) * h, size, C.text);
                ctx.restore();
            }
        }

        /* ── Frame ────────────────────────────────────────────────────────── */
        function renderFrame(t) {
            const S0 = computeState(t);

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = C.ground;
            ctx.fillRect(0, 0, cv.width, cv.height);

            if (BREATHE > 0) {
                const k = S0.breathe;
                ctx.translate(cv.width / 2, cv.height / 2);
                ctx.scale(k, k);
                ctx.translate(-cv.width / 2, -cv.height / 2);
            }

            // Header. The only number the viewer is meant to actually read.
            text('OPEN EXCEPTIONS', MW / 2, 176, HERO_LABEL, C.muted, 'center');
            drawOdometer(S0.exceptions, MW / 2, 318, HERO_FIG);

            // Zone headers and their rules.
            ZONE_SPEC.forEach((zs, zi) => {
                const zx = PAD_X + zi * (ZONE_W + ZONE_GAP);
                text(zs.name, zx, ZONE_LABEL_Y, LABEL_ZONE, C.muted);
                line(zx, ZONE_LABEL_Y + 16, zx + ZONE_W, ZONE_LABEL_Y + 16, C.line, 1);
            });

            // Tiles. Count and geometry are identical at every t.
            TILES.forEach((tl, i) => {
                const st = S0.tiles[i];
                const tone = mix(C.flow, C.open, st.a);

                fillRect(tl.x, tl.y, tl.w, tl.h, C.raised);

                // Border: dormant line, lifted while the sweep is in contact,
                // and held at human amber for the three that stay human.
                let border = mix(C.line, C.lineHi, st.contact);
                if (st.human) border = mix(border, C.human, S0.humanRing);
                rect(tl.x, tl.y, tl.w, tl.h, border, 1);

                text(tl.label, tl.x + PAD_IN, tl.y + PAD_IN + LABEL_TILE, LABEL_TILE, C.muted);
                DRAW[tl.type](tl, st, tone);

                // The human marker: a ring, not a filled dot, not an alert
                // triangle, not an exclamation mark. Calm, not urgent.
                if (st.human && S0.humanRing > 0.004) {
                    ctx.beginPath();
                    ctx.arc(px(tl.x + tl.w - RING_R - 9), px(tl.y + RING_R + 9), px(RING_R), 0, TAU);
                    stroke(mix(C.line, C.human, S0.humanRing), 1);
                }
            });

            // The layer engaging: a thin vertical band of line-hi passing
            // through. No glow, no pulse, no leading edge, no easing. It is a
            // state change moving across the panel, not a light source.
            if (S0.sweepOn) {
                const x = lerp(PANEL_L - SWEEP_W, PANEL_R, S0.sweepP);
                ctx.globalAlpha = 0.5;
                fillRect(x, PANEL_TOP - 46, SWEEP_W, PANEL_H + 46, C.lineHi);
                ctx.globalAlpha = 1;
                line(x + SWEEP_W, PANEL_TOP - 46, x + SWEEP_W, PANEL_BOT, C.lineHi, 1);
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        /* ── Render-harness contract ──────────────────────────────────────── */
        setSize(MW, MH);

        window.__DURATION = DURATION;
        window.__FPS = FPS;
        window.__setSize = setSize;
        window.__renderFrame = renderFrame;
        window.__computeState = computeState;
        window.__exportWebp = (q) => cv.toDataURL('image/webp', q === undefined ? 0.92 : q);
        window.__ready = document.fonts.load(`500 20px "Plex Mono"`).then(() => document.fonts.ready);

        window.__ready.then(() => renderFrame(0));
    </script>
</body>

</html>
