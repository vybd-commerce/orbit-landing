<!doctype html>
<html lang="en">
<!-- Outside Context resources. Served at /outside-context/resources via vercel.json.
     Content lives in public/outside-context-resources.json: edit that, not this page. -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources | Outside Context</title>
  <meta name="description" content="Free things to read, watch and try if you're working out what AI means for your work. Picked by the Outside Context community." />
  <link rel="canonical" href="https://www.vybd.ai/outside-context/resources" />
  <meta name="theme-color" content="#F4F1EA" />
  <link rel="icon" type="image/svg+xml" href="/outside-context-icon.svg" />
  <meta property="og:title" content="Outside Context · Resources" />
  <meta property="og:description" content="Free things to read, watch and try about AI and the future of work." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.vybd.ai/outside-context/resources" />
  <meta property="og:image" content="https://www.vybd.ai/og-outside-context.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.vybd.ai/og-outside-context.png" />
  <link rel="preload" href="/fonts/EBGaramond-Latin-Regular.woff" as="font" type="font/woff" crossorigin />
  <script defer data-domain="vybd.ai" src="https://plausible.io/js/script.js"></script>
  <style>
    @font-face { font-family: "EB Garamond"; src: url("/fonts/EBGaramond-Latin-Regular.woff") format("woff"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "EB Garamond"; src: url("/fonts/EBGaramond-Latin-Medium.woff") format("woff"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "EB Garamond"; src: url("/fonts/EBGaramond-Latin-Italic.woff") format("woff"); font-weight: 400; font-style: italic; font-display: swap; }
    :root { --paper: #F4F1EA; --ink: #111111; --gray: #5F5F5F; --line: rgba(17,17,17,.2); --accent: #C4552D; --error: #A3311A;
      --ease: cubic-bezier(.16, 1, .3, 1); color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--paper); }
    ::selection { background: var(--accent); color: var(--paper); }
    body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; background: var(--paper); color: var(--ink);
      font-family: "EB Garamond", Georgia, "Times New Roman", serif; font-kerning: normal; -webkit-font-smoothing: antialiased;
      padding: clamp(40px, 7vh, 72px) 24px 40px; }
    main { width: 100%; max-width: 36rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    a { color: inherit; text-underline-offset: .18em; }

    .top { display: flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; }
    .top svg { width: 34px; height: auto; }
    .top span { font-weight: 500; font-size: 17px; letter-spacing: .08em; }
    header.intro { text-align: center; margin-top: clamp(40px, 8vh, 72px); }
    h1 { font-weight: 400; font-size: clamp(48px, 11vw, 84px); line-height: .95; letter-spacing: -.012em; text-wrap: balance; }
    .lede { margin: 20px auto 0; font-size: 20px; line-height: 1.45; color: var(--gray); max-width: 28em; text-wrap: balance; }

    section { margin-top: clamp(56px, 9vh, 80px); }
    h2 { font-weight: 400; font-size: clamp(32px, 6vw, 40px); line-height: 1.05; letter-spacing: -.01em; }

    .items { list-style: none; margin-top: 20px; border-top: 1px solid var(--ink); }
    .items li { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px; padding: 18px 0 17px; border-bottom: 1px solid var(--line); }
    .items a { grid-column: 1; font-size: 21px; line-height: 1.25; text-decoration-color: rgba(17,17,17,.35); overflow-wrap: anywhere; }
    .items a:hover { text-decoration-color: var(--accent); }
    .items .ext { font-size: .8em; color: var(--gray); margin-left: .25em; }
    .items .tag { grid-column: 2; grid-row: 1; font-size: 16px; font-style: italic; color: var(--gray); }
    .items p { grid-column: 1 / -1; font-size: 17px; line-height: 1.45; color: var(--gray); }
    .empty { margin-top: 26px; padding: 26px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); font-size: 19px; line-height: 1.5; font-style: italic; color: var(--gray); }

    footer { margin-top: 88px; font-size: 15px; color: var(--gray); display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(107,107,107,.3); }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <a class="top" href="/outside-context" aria-label="Outside Context home">
      <svg viewBox="-50.9 -58.48 127.953 109.38" aria-hidden="true"><circle cx="0" cy="0" r="50" fill="none" stroke="#111" stroke-width="2.2" /><circle cx="67.553" cy="-49.08" r="9.5" fill="#C4552D" /></svg>
      <span>OUTSIDE CONTEXT</span>
    </a>

    <header class="intro">
      <h1>Worth your time.</h1>
      <p class="lede">Free things to read, watch and try if you're working out what AI means for your work. Picked by people who come on Sundays.</p>
    </header>

    <div id="list" aria-live="polite"></div>
  </main>
  <footer><a href="/outside-context">Outside Context</a><a href="/outside-context/community">Community</a><a href="/outside-context/board">Board</a><a href="/">vybd.ai</a></footer>

  <script>
  (function () {
    "use strict";
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function safeUrl(u) { try { var x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch (e) { return null; } }
    function track(event) {
      var body = JSON.stringify({ event: event, path: location.pathname, referrer: document.referrer || null });
      try { if (navigator.sendBeacon && navigator.sendBeacon("/api/oc/track", new Blob([body], { type: "application/json" }))) return; } catch (e) {}
      fetch("/api/oc/track", { method: "POST", body: body, headers: { "content-type": "application/json" }, keepalive: true }).catch(function () {});
    }
    track("resources_view");

    var list = document.getElementById("list");
    fetch("/outside-context-resources.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
      var cats = (d && d.categories) || [];
      list.innerHTML = cats.map(function (c, i) {
        var items = (c.items || []).map(function (it) {
          var url = safeUrl(it.url);
          if (!url || !it.title) return "";
          return "<li><a href=\"" + esc(url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(it.title) +
            "<span class=\"ext\" aria-hidden=\"true\">&#8599;</span><span class=\"sr\"> (opens in a new tab)</span></a>" +
            (it.tag ? "<span class=\"tag\">" + esc(it.tag) + "</span>" : "") +
            (it.note ? "<p>" + esc(it.note) + "</p>" : "") + "</li>";
        }).join("");
        if (!items) return "";
        var id = "cat-" + i;
        return "<section aria-labelledby=\"" + id + "\"><h2 id=\"" + id + "\">" + esc(c.name) + "</h2><ul class=\"items\">" + items + "</ul></section>";
      }).join("") || '<p class="empty">The list is being put together. Check back after Sunday.</p>';
    }).catch(function () {
      list.innerHTML = '<p class="empty">Couldn\'t load the list. Refresh to try again.</p>';
    });
  })();
  </script>
</body>
</html>
