<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
body{margin:0;background:#FFFFFF}
.ps{--navy:#0f1b33;--grey:#5b6270;--muted:#8a909b;--line:#e7e9ed;--mint:#1BB59B;--mint-d:#17A088;font-family:'DM Sans',system-ui,sans-serif;color:var(--navy);background:#FFFFFF;padding:clamp(56px,7vw,112px) clamp(20px,5vw,48px);text-align:center}
.ps-title{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(44px,5.2vw,72px);line-height:1;letter-spacing:-.015em}
.ps-sub{margin:16px auto 0;font-size:clamp(18px,1.6vw,22px);color:var(--grey)}
.ps-wall{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;max-width:1180px;margin:clamp(44px,5vw,72px) auto 0}
.ps-logo{position:relative;display:flex;align-items:center;justify-content:center;height:88px;padding:0 10px;border:0;background:none;cursor:pointer;border-radius:16px;transition:background .3s}
.ps-logo:hover{background:#f6f7f9}
.ps-logo img{max-width:100%;max-height:40px;object-fit:contain;filter:grayscale(1);opacity:.32;transition:opacity .35s,transform .35s}
.ps-logo:hover img{opacity:.7}
.ps-logo.on img{opacity:1;transform:scale(1.06)}
.ps-bar{position:absolute;left:18%;right:18%;bottom:6px;height:2px;border-radius:2px;background:#e7e9ed;overflow:hidden;opacity:0;transition:opacity .3s}
.ps-logo.on .ps-bar{opacity:1}
.ps-bar i{display:block;height:100%;background:var(--navy);transform-origin:left;transform:scaleX(0)}
.ps-logo.on .ps-bar i{animation:fill var(--dur,4.5s) linear forwards}
.ps-logo.on.hold .ps-bar i{animation:none;transform:scaleX(1)}
@keyframes fill{to{transform:scaleX(1)}}
.ps-panel{max-width:1080px;margin:28px auto 0;border-radius:32px;background:#f6f7f9;display:flex;flex-wrap:wrap;text-align:left;overflow:hidden}
.ps-l{flex:1 1 420px;min-width:0;padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;gap:14px}
.ps-r{flex:1 1 380px;min-width:0;padding:clamp(28px,4vw,52px);background:#0f1b33;color:#FFFFFF;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.in{animation:up .6s cubic-bezier(.2,.75,.2,1) both}
.in.b{animation-name:up2}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes up2{from{opacity:0;transform:translateY(14px)}}
.ps-l img{height:48px;max-width:240px;object-fit:contain;object-position:left;display:block}
.ps-lbl{margin:10px 0 0;font-size:14px;font-weight:500;color:var(--muted)}
.ps-hl{margin:0;font-family:'Instrument Serif',Georgia,serif;font-size:clamp(40px,4.6vw,64px);line-height:1.02;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ps-meta{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.ps-r small{font-size:12px;font-weight:600;letter-spacing:.14em;color:#9ca3af}
.ps-route{display:flex;flex-direction:column;gap:12px}
.ps-line{display:flex;align-items:center;gap:10px}
.ps-end{width:12px;height:12px;border-radius:50%;border:2px solid #FFFFFF;box-sizing:border-box}
.ps-end.to{background:var(--mint);border-color:var(--mint)}
.ps-track{position:relative;flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 6px,transparent 6px 11px)}
.ps-ship{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--mint);color:var(--navy);display:grid;place-items:center;animation:sail 2.6s cubic-bezier(.5,0,.5,1) .3s both}
.ps-ship.b{animation-name:sail2}
@keyframes sail{from{left:0}to{left:100%}}
@keyframes sail2{from{left:0}to{left:100%}}
.ps-labels{display:flex;justify-content:space-between;font-size:14px;font-weight:500;color:#d1d5db}
.ps-det{margin:0;font-size:clamp(18px,1.7vw,22px);line-height:1.4;color:#FFFFFF}
.ps-tag{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(27,181,155,.16);color:var(--mint);font-size:13px;font-weight:600}
.ps-tag i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
@media (max-width:860px){.ps-wall{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ps-ship{left:50%}}
</style>
</head><body><div id="root"></div>
<template id="tpl">

<section class="ps" aria-labelledby="ps-title" onMouseEnter="{{ hold }}" onMouseLeave="{{ release }}">
<h2 id="ps-title" class="ps-title">Already in the US.</h2>
<p class="ps-sub">Real brands, real US results.</p>
<div class="ps-wall" role="tablist" aria-label="Brands">
<sc-for list="{{ logos }}" as="l" hint-placeholder-count="7"><button type="button" role="tab" class="{{ l.cls }}" aria-selected="{{ l.on }}" aria-label="{{ l.name }}" onClick="{{ l.pick }}"><img src="{{ l.logo }}" alt=""><span class="ps-bar"><i></i></span></button></sc-for>
</div>
<sc-for list="{{ panel }}" as="p" hint-placeholder-count="1">
<div class="ps-panel" role="tabpanel">
<div class="ps-l">
<img class="{{ p.in }}" src="{{ p.logo }}" alt="{{ p.name }}">
<p class="{{ p.in1 }}" style="margin: 10px 0 0; font-size: 14px; font-weight: 500; color: #8a909b">{{ p.label }}</p>
<p class="{{ p.hlCls }}">{{ p.headline }}</p>
<div class="ps-meta">{{ p.meta }}</div>
</div>
<div class="ps-r">
<div class="ps-route">
<small>ROUTE</small>
<div class="ps-line"><span class="ps-end"></span><span class="ps-track"><span class="{{ p.shipCls }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg></span></span><span class="ps-end to"></span></div>
<div class="ps-labels"><span>{{ p.from }}</span><span>United States</span></div>
</div>
<p class="{{ p.detCls }}">{{ p.detail }}</p>
<span class="ps-tag"><i></i>Live in the US with Vybd</span>
</div>
</div>
</sc-for>
</section>
</template>
<script>
class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; }
  setState(o, cb){ const v = typeof o === 'function' ? o(this.state) : o; Object.assign(this.state, v); __schedule(cb); }
  forceUpdate(){ __schedule(); } }

class Component extends DCLogic {
constructor(props) {
super(props);
this.B = [
{ name: 'Bayangrom', from: 'India', pre: '$', target: 180, comma: false, suf: 'K/yr recovered', label: 'Inventory and shipping', meta: 'India · Art and apparel', detail: '−28% excess inventory, −22% shipping cost.', logo: '/_blob/7f753feabce939ea3fa2e0fc24461b0c' },
{ name: 'MIB Industries', from: 'India', pre: '$', target: 30000, comma: true, suf: ' in B2B pre‑orders', label: 'Wholesale pre-orders', meta: 'India · Luxury terry cotton products', detail: 'Wholesale launch done. Now building their direct-to-consumer store.', logo: '/_blob/534fb7a6258c2b063af3137ddd180be6' },
{ name: 'Sugat Traders', from: 'India', pre: '$', target: 25000, comma: true, suf: ' in B2B revenue', label: 'B2B revenue', meta: 'India · Herbal powders and sustainable food packaging', detail: 'Selling to US business buyers from India.', logo: '/_blob/3cf6ba6d3acce6bd7899b0e12c19ecb1' },
{ name: 'Ollobot', from: 'China', pre: '', target: 5000, comma: true, suf: ' robots delivered', label: 'Delivery and customer support', meta: 'China · Companion robots', detail: 'We run their US customer support too.', logo: '/_blob/8173f352091347e9f7dc6ed7f6c12ed4' },
{ name: 'Karama', from: 'USA', pre: '$', target: 10000, comma: true, suf: ' in pre‑orders before launch', label: 'Pre-launch', meta: 'USA · Premium underwear', detail: 'Pre-orders secured before launch.', logo: '/_blob/59544c25694837ecadcfcd871815b437' },
{ name: 'Ouwr', from: 'South Korea', pre: '$', target: 15000, comma: true, suf: ' raised', label: 'Funding', meta: 'South Korea · K-fashion, womenswear', detail: 'Funding raised for their US market entry.', logo: '/_blob/afde41d481be31f2c41fb29d98ebb8f7' },
{ name: 'Cellre', from: 'South Korea', pre: '$', target: 15000, comma: true, suf: ' raised', label: 'Funding', meta: 'South Korea · K-beauty', detail: 'Funding raised for their US market entry.', logo: '/_blob/47fe1ec46037f15173919d5efd51a63b' }
];
this.state = { active: 0, n: 0, hold: false };
}
componentDidMount() {
this.go(0);
this.timer = setInterval(() => {
if ((this.props.autoplay ?? true) === false || this.state.hold) return;
this.go((this.state.active + 1) % this.B.length);
}, 4500);
}
componentWillUnmount() { clearInterval(this.timer); cancelAnimationFrame(this.raf); }
go(i) {
this.setState({ active: i, n: 0 });
cancelAnimationFrame(this.raf);
const target = this.B[i].target, t0 = performance.now() + 200;
const step = (now) => {
const p = Math.max(0, Math.min(1, (now - t0) / 1100));
this.setState({ n: Math.round(target * (1 - Math.pow(1 - p, 3))) });
if (p < 1) this.raf = requestAnimationFrame(step);
};
this.raf = requestAnimationFrame(step);
}
renderVals() {
const a = this.state.active, b = this.B[a], alt = a % 2 ? ' b' : '';
const num = b.comma ? this.state.n.toLocaleString('en-US') : String(this.state.n);
return {
hold: () => this.setState({ hold: true }),
release: () => this.setState({ hold: false }),
logos: this.B.map((x, i) => ({ name: x.name, logo: x.logo, on: i === a, cls: 'ps-logo' + (i === a ? ' on' : '') + (this.state.hold ? ' hold' : ''), pick: () => this.go(i) })),
panel: [{
name: b.name, logo: b.logo, label: b.label, meta: b.meta, from: b.from, detail: b.detail,
headline: b.pre + num + b.suf,
in: 'in' + alt, in1: 'in d1' + alt, hlCls: 'ps-hl in d2' + alt, detCls: 'ps-det in d3' + alt, shipCls: 'ps-ship' + alt
}]
};
}
}

const TPL = document.getElementById('tpl');
let comp, pending = false, cbs = [];
function lookup(path, scope){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false; if (/^-?[0-9.]+$/.test(path)) return Number(path);
  const parts = path.split('.'); let v = scope; for (const p of parts) { if (v == null) return undefined; v = v[p]; } return v; }
function interp(str, scope){ const m = str.match(/^\s*\{\{([^}]*)\}\}\s*$/); if (m) return lookup(m[1], scope); return str.replace(/\{\{([^}]*)\}\}/g, (_, p) => { const v = lookup(p, scope); return v == null ? '' : v; }); }
const EV = { onClick:'click', onMouseMove:'mousemove', onMouseLeave:'mouseleave', onMouseEnter:'mouseenter', onPointerDown:'pointerdown', onPointerMove:'pointermove', onPointerUp:'pointerup', onPointerCancel:'pointercancel', onFocus:'focus', onBlur:'blur', onKeyDown:'keydown', onChange:'change' };
function build(node, scope, parent){
  if (node.nodeType === 3) { parent.appendChild(document.createTextNode(interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') { const list = interp(node.getAttribute('list'), scope) || []; const as = node.getAttribute('as');
    list.forEach((item, i) => { const sc = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach(c => build(c, sc, parent)); }); return; }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(c => build(c, scope, parent)); return; }
  const ns = node.namespaceURI; const el = ns && ns !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(ns, node.tagName) : document.createElement(node.tagName);
  let ref = null;
  for (const a of node.attributes) { const name = a.name; const v = interp(a.value, scope);
    if (name === 'ref') { ref = v; continue; }
    const ev = Object.keys(EV).find(k => k.toLowerCase() === name.toLowerCase());
    if (ev) { if (typeof v === 'function') el.addEventListener(EV[ev], v); continue; }
    if (v === false || v == null) continue; el.setAttribute(name, v === true ? '' : v); }
  node.childNodes.forEach(c => build(c, scope, el));
  if (tag === 'select' && node.getAttribute('value')) el.value = interp(node.getAttribute('value'), scope);
  parent.appendChild(el);
  if (typeof ref === 'function') ref(el);
}
function render(){ const vals = comp.renderVals(); const root = document.getElementById('root'); root.innerHTML = '';
  const frag = document.createElement('div'); TPL.content.childNodes.forEach(n => build(n, vals, frag)); while (frag.firstChild) root.appendChild(frag.firstChild); }
function __schedule(cb){ if (cb) cbs.push(cb); if (pending) return; pending = true; setTimeout(() => { pending = false; render(); const c = cbs; cbs = []; c.forEach(f => f()); }, 0); }
comp = new Component({"showLoader": false}); render(); if (comp.componentDidMount) comp.componentDidMount();
</script></body></html>
