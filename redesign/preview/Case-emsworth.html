<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -8 112 108'%3E%3Cpath d='M4 4 L36 4 L50 46 Z' fill='%235FD6BF'/%3E%3Cpath d='M4 4 L50 46 L38 88 Z' fill='%231BB59B'/%3E%3Cpath d='M96 4 L64 4 L50 46 Z' fill='%2325324d'/%3E%3Cpath d='M96 4 L50 46 L62 88 Z' fill='%230f1b33'/%3E%3Cpath d='M38 88 L50 46 L62 88 Z' fill='%2313987F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
body{margin:0;background:#FFFFFF}
h1,h2,.display{font-family:'Instrument Serif',Georgia,serif;font-weight:400!important;letter-spacing:-.015em!important}
h1 em,h2 em{font-style:italic}
html{scroll-behavior:smooth}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:clamp(20px,5vw,48px);padding-right:clamp(20px,5vw,48px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font-weight:500;font-size:17px;transition:transform .25s,background .25s,color .25s,box-shadow .25s}
.btn:hover{transform:scale(1.03)}
.btn-dark{background:#111827;color:#FFFFFF}.btn-dark:hover{background:#000000;color:#FFFFFF}
.btn-mint{background:var(--mint);color:#111827}.btn-mint:hover{background:var(--mint-hover);color:#111827}
.btn-ghost{color:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}.btn-ghost:hover{color:#FFFFFF;box-shadow:inset 0 0 0 1px #FFFFFF}
.nav-link{padding:14px 0;font-size:14px;color:#4B5563;transition:color .2s}.nav-link:hover{color:#000000}
.nav-link[aria-current]{color:#111827;font-weight:600}
.menu-btn{display:none;width:44px;height:44px;border:0;border-radius:50%;background:#F3F4F6;color:#111827;place-items:center;cursor:pointer}
.mnav{display:flex;flex-direction:column;gap:4px;padding:8px 16px 16px;border-top:1px solid #E5E7EB;background:#FFFFFF;animation:fadeUp .25s ease}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 4px;font-size:17px;font-weight:500;border-bottom:1px solid #F3F4F6}
.mnav .btn{margin-top:12px;border-bottom:0;justify-content:center}
@media (max-width:760px){.nav-links{display:none!important}.nav-cta{display:none!important}.menu-btn{display:grid}}
@media (min-width:761px){.mnav{display:none}}
.secnum{display:none}
.rv{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% cover 24%}
@keyframes reveal{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* hero */
.ch{position:relative;padding:calc(var(--sec) * .9) 0 var(--sec);overflow:hidden}
.ch::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#dfe3e8 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse 50% 70% at 78% 50%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse 50% 70% at 78% 50%,#000 15%,transparent 72%);pointer-events:none}
.ch-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,5vw,80px);align-items:center}
@media (max-width:960px){.ch-grid{grid-template-columns:minmax(0,1fr)}}
.ch-back{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#4B5563;opacity:0;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) .05s forwards}
.ch-back svg{transition:transform .3s}.ch-back:hover{color:#0f1b33}.ch-back:hover svg{transform:translateX(-4px)}
.ch-cat{display:flex;align-items:center;gap:10px;margin-top:28px;color:#6B7280;opacity:0;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) .12s forwards}
.ch-cat i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.ch h1{margin:16px 0 0;font-size:clamp(44px,5.6vw,84px);line-height:1;color:#0f1b33;text-wrap:balance}
.ch h1 span{display:block;overflow:hidden;padding-bottom:.08em}
.ch h1 span>b{display:block;font-weight:400;transform:translateY(105%);animation:chRise 1.1s cubic-bezier(.2,.8,.2,1) .2s forwards}
@keyframes chRise{to{transform:none}}
.ch-sum{margin:24px 0 0;max-width:54ch;font-size:clamp(18px,1.6vw,21px);line-height:1.5;color:#5b6270;opacity:0;animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) .5s forwards}
/* shipping label */
.lab{position:relative;padding:24px;border-radius:20px;background:#FFFFFF;border:1px solid #E7E9ED;box-shadow:0 1px 2px rgba(15,27,51,.05),0 40px 80px -40px rgba(15,27,51,.45);opacity:0;animation:labIn 1s cubic-bezier(.2,.8,.2,1) .35s forwards;transform-origin:50% 0}
@keyframes labIn{from{opacity:0;transform:translateY(30px) rotate(3deg)}to{opacity:1;transform:rotate(-1.5deg)}}
.lab-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.16em;color:#0f1b33}
.lab-top span:last-child{border:1.5px solid #0f1b33;padding:3px 7px}
.lab hr{border:0;border-top:1.5px dashed #c9ced6;margin:16px 0}
.lab-brand{font-family:'Instrument Serif',Georgia,serif;font-size:clamp(36px,3.6vw,48px);line-height:1;color:#0f1b33}
.lab-rows{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.lab-rows small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;color:#8a909b}
.lab-rows b{display:block;margin-top:3px;font-size:15px;color:#0f1b33}
.lab-bars{height:38px;margin-top:20px;background:repeating-linear-gradient(90deg,#0f1b33 0 2px,transparent 2px 5px,#0f1b33 5px 6px,transparent 6px 9px,#0f1b33 9px 12px,transparent 12px 14px)}
.lab-trk{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#5b6270}
.lab-stamp{position:absolute;right:-12px;bottom:-30px;width:92px;height:92px;background:rgba(255,255,255,.55);border-radius:50%;border:3px solid var(--mint-hover);box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 0 5px var(--mint-hover);display:grid;place-items:center;text-align:center;color:var(--mint-hover);font-size:13px;font-weight:800;letter-spacing:.12em;line-height:1.15;transform:rotate(-14deg) scale(1.9);opacity:0;mix-blend-mode:multiply;animation:labStamp .6s cubic-bezier(.3,1.5,.5,1) 1.15s forwards}
@media (max-width:600px){.lab-stamp{right:2px;bottom:-26px;width:84px;height:84px}}
.lab-stamp small{display:block;font-size:9px;letter-spacing:.16em}
@keyframes labStamp{0%{opacity:0;transform:rotate(-34deg) scale(1.9)}60%{opacity:.95;transform:rotate(-12deg) scale(.92)}100%{opacity:.9;transform:rotate(-14deg) scale(1)}}

/* metrics */
.cm{margin:0 clamp(12px,2vw,24px);border-radius:36px;background:#0f1b33;color:#FFFFFF}
.cm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding-top:calc(var(--sec) * .55);padding-bottom:calc(var(--sec) * .55)}
@media (max-width:760px){.cm-grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.cm-item{padding:0 clamp(16px,3vw,40px);border-left:1px solid rgba(255,255,255,.12)}
.cm-item:first-child{border-left:0;padding-left:0}
@media (max-width:760px){.cm-item{border-left:0;padding:0;border-top:1px solid rgba(255,255,255,.12);padding-top:24px}.cm-item:first-child{border-top:0;padding-top:0}}
.cm-item b{display:block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(52px,6vw,88px);line-height:1;color:#FFFFFF;font-variant-numeric:tabular-nums}
.cm-item span{display:block;margin-top:12px;font-size:16px;line-height:1.4;color:#9CA3AF;max-width:24ch}
.cm-item:nth-child(1) b{color:var(--mint)}

/* story */
.cs{padding-top:var(--sec);padding-bottom:var(--sec)}
.cs-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:860px){.cs-grid{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.toc{position:sticky;top:96px}
.toc p{margin:0 0 14px;color:#8a909b}
.toc ol{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid #EEF0F3;display:grid;gap:4px;position:relative}
.toc a{display:block;padding:7px 0;font-size:15px;color:#6B7280;transition:color .25s}
.toc a:hover{color:#0f1b33}
.toc a.on{color:#0f1b33;font-weight:600}
.toc .bar{position:absolute;left:-2px;top:0;width:2px;height:var(--h,0px);background:var(--mint);transform:translateY(var(--y,0px));transition:transform .4s cubic-bezier(.2,.8,.2,1),height .4s cubic-bezier(.2,.8,.2,1)}
.blk{scroll-margin-top:96px;padding-bottom:clamp(56px,7vw,96px)}
.blk:last-child{padding-bottom:0}
.blk h2{margin:0;font-size:clamp(36px,4vw,56px);line-height:1;color:#0f1b33}
.blk .k{display:block;margin-bottom:14px;color:#8a909b}
.blk p.body{margin:20px 0 0;max-width:62ch;font-size:clamp(18px,1.5vw,20px);line-height:1.6;color:#374151}
.chal{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.chal{grid-template-columns:minmax(0,1fr)}}
.chal li{position:relative;display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:16px;background:#F7F8FA;border:1px solid #EEF0F3;font-size:16px;line-height:1.45;color:#374151;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.chal li.in{opacity:1;transform:none}
.chal li i{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#FFFFFF;border:1px solid #E1E5EA;font-style:normal;font-weight:700;font-size:13px;color:#E8A23A}
.sol{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:0;counter-reset:s}
.sol li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;padding:18px 0;border-top:1px solid #EEF0F3;font-size:clamp(17px,1.4vw,19px);line-height:1.5;color:#374151}
.sol li:last-child{border-bottom:1px solid #EEF0F3}
.sol .tick{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid #D6DAE1;transition:border-color .4s,background .4s}
.sol .tick svg{width:16px;height:16px;stroke:#0f1b33;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .5s cubic-bezier(.6,0,.2,1) .15s}
.sol li.in .tick{border-color:var(--mint);background:var(--mint)}
.sol li.in .tick svg{stroke-dashoffset:0}
.sol li span{transition:color .4s}
.sol li.in span{color:#0f1b33}
.imp{margin-top:28px;padding:clamp(28px,4vw,48px);border-radius:28px;background:#E9F7F4;position:relative;overflow:hidden}
.imp::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:2px dashed rgba(23,160,136,.35)}
.imp p{position:relative;margin:0;font-family:'Instrument Serif',Georgia,serif;font-size:clamp(28px,3vw,42px);line-height:1.15;color:#0f1b33;max-width:26ch}

/* next + cta */
.nx{padding-bottom:var(--sec)}
.nx a{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding:clamp(24px,4vw,40px);border-radius:28px;border:1px solid #E7E9ED;transition:border-color .3s,box-shadow .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
.nx a:hover{border-color:var(--mint);box-shadow:0 30px 60px -36px rgba(15,27,51,.45);transform:translateY(-4px)}
.nx small{display:block;color:#8a909b}
.nx strong{display:block;margin-top:10px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,56px);line-height:1;color:#0f1b33}
.nx p{margin:8px 0 0;color:#5b6270;max-width:52ch}
.nx .arr{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#0f1b33;color:#FFFFFF;transition:background .3s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.nx a:hover .arr{background:var(--mint);color:#0f1b33;transform:translateX(6px)}
.cta{padding:0 clamp(12px,2vw,24px)}
.cta-in{position:relative;overflow:hidden;background:#111827;color:#FFFFFF;border-radius:36px;padding:calc(var(--sec) * 1.1) 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.cta h2{margin:0;font-size:clamp(46px,7vw,104px);line-height:.98}
.cta h2 em{color:var(--mint)}
.cta p{margin:0;max-width:480px;font-size:20px;line-height:1.45;color:#9CA3AF}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* footer (from vybd.ai) */
.hf-band{--hf-ink:#0f1b33;--hf-muted:#5b6270;--hf-dim:#6b7280;--hf-ring:rgba(15,27,51,.14);--o:min(1120px,82vw);margin:var(--sec,72px) 0 0;padding:0 clamp(20px,5vw,48px) 24px;background:#FFFFFF;color:var(--hf-ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;overflow:hidden}
.hf-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 32px;max-width:1120px;margin:0 auto}
.hf-head{margin:0 0 18px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;font-weight:400;letter-spacing:.06em!important;text-transform:uppercase;color:var(--hf-dim)}
.hf-head--gap{margin-top:40px}
.hf-col ul{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hf-col a{font-size:16px;line-height:1.35;color:var(--hf-ink);text-decoration:none;overflow-wrap:anywhere}
.hf-col a:hover,.hf-legal a:hover{text-decoration:underline;text-underline-offset:3px;color:var(--hf-ink)}
.hf-brand{display:flex;justify-content:center;margin-top:calc(var(--o) * -.03)}
.hf-orbit{position:relative;display:flex;align-items:flex-end;justify-content:center;width:var(--o);height:calc(var(--o) * .5625);overflow:hidden}
.hf-ring{position:absolute;border-style:solid;border-radius:50%;pointer-events:none;box-sizing:border-box}
.hf-ring--thin{top:calc(var(--o) * .0625);left:0;width:var(--o);height:var(--o);border-width:1px;border-color:var(--hf-ring);animation:hf-orbit 20s linear infinite}
.hf-ring--thick{top:calc(var(--o) * .075);left:calc(var(--o) * .0125);width:calc(var(--o) * .975);height:calc(var(--o) * .975);border-width:2px;border-color:var(--hf-ink) transparent;opacity:.25;transform:rotate(-45deg);animation:hf-rock 15s ease-in-out infinite alternate}
.hf-planet{position:absolute;top:10%;left:20%;width:20px;height:20px;border:2px solid var(--hf-ink);border-radius:50%;background:var(--mint,#1BB59B);transform:translate(-50%,-50%);box-sizing:border-box}
.hf-word{position:relative;z-index:1;margin-bottom:.18em;font-size:calc(var(--o) * .27);font-weight:700;line-height:.7;letter-spacing:-.07em;color:var(--hf-ink);user-select:none}
@keyframes hf-orbit{100%{transform:rotate(360deg)}}
@keyframes hf-rock{0%{transform:rotate(-45deg)}100%{transform:rotate(-135deg)}}
.hf-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;max-width:1120px;margin:0 auto;padding-top:20px;border-top:1px solid rgba(15,27,51,.08)}
.hf-tagline p{margin:0}
.hf-tagline-main{font-size:clamp(22px,2vw,30px);font-weight:500;line-height:1.1;letter-spacing:-.03em}
.hf-copy{font-size:14px;color:var(--hf-muted);margin-top:8px!important}
.hf-legal{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px}
.hf-legal-links{display:flex;gap:24px;white-space:nowrap}
.hf-legal a{font-size:14px;color:var(--hf-muted);text-decoration:none}
.hf-band a:focus-visible{outline:2px solid var(--hf-ink);outline-offset:3px;border-radius:2px}
.ls{--ls-ink:#0f1b33;--ls-line:rgba(15,27,51,.2);--ls-line-hover:rgba(15,27,51,.45);position:relative;display:inline-flex;align-items:center;height:44px;border-radius:999px;border:1px solid var(--ls-line);color:var(--ls-ink);transition:border-color .16s}
.ls:hover{border-color:var(--ls-line-hover)}
.ls:focus-within{outline:3px solid var(--ls-ink);outline-offset:3px}
.ls-select{appearance:none;-webkit-appearance:none;height:100%;padding:0 38px 0 40px;border:0;border-radius:inherit;background:transparent;color:inherit;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.ls-select:focus{outline:none}
.ls-globe,.ls-chevron{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.ls-globe{left:15px;width:18px;height:18px}
.ls-chevron{right:14px;width:16px;height:16px;opacity:.7}
.ls-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:639px){.hf-band{--o:calc(100vw - 40px)}.hf-brand{margin-top:40px;padding:0 8px 16px}.hf-cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 20px}.hf-col a{font-size:15px}.hf-bottom,.hf-legal{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.hf-ring{animation:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ch-back,.ch-cat,.ch-sum,.lab{opacity:1}.ch h1 span>b{transform:none}.lab-stamp{opacity:.9;transform:rotate(-14deg)}.chal li{opacity:1;transform:none}.sol .tick svg{stroke-dashoffset:0}}

/* app bar language switcher */
.nav-end{display:flex;align-items:center;gap:10px}
.nls{position:relative;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 11px 0 11px;border-radius:999px;border:1px solid rgba(15,27,51,.14);color:#0f1b33;font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap;cursor:pointer;transition:border-color .2s,background .2s}
.nls:hover{border-color:rgba(15,27,51,.35);background:rgba(255,255,255,.7)}
.nls:focus-within{outline:2px solid var(--mint,#1BB59B);outline-offset:2px}
.nls svg{flex:none}
.nls .nls-chev{opacity:.6}
.nls-select{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;border:0;font-size:16px;appearance:none;-webkit-appearance:none}
@media (max-width:760px){.nls{height:44px;padding:0 12px}}

/* brand: folded V logo. Static by default; JS plays the fold-in once on load and on hover (never loops) */
.lg{display:inline-flex;align-items:center;gap:9px;color:#0f1b33}
.lg-mark{display:block;overflow:visible;flex:none}
.lg-f{transform-box:fill-box}
.lg-f:nth-child(1){transform-origin:100% 100%}.lg-f:nth-child(2){transform-origin:100% 50%}.lg-f:nth-child(3){transform-origin:0 100%}.lg-f:nth-child(4){transform-origin:0 50%}.lg-f:nth-child(5){transform-origin:50% 0}

</style>

<header style="position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.78); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px)">

<aside class="toc" aria-label="On this page"><p class="mono">On this page</p><ol ref="{{ tocRef }}"><span class="bar" aria-hidden="true"></span><li><a href="#overview" data-sec="overview">Overview</a></li><li><a href="#role" data-sec="role">Our role</a></li><li><a href="#challenges" data-sec="challenges">Challenges</a></li><li><a href="#solutions" data-sec="solutions">What we did</a></li><li><a href="#impact" data-sec="impact">Impact</a></li></ol></aside>

<div class="blk rv" id="overview"><h2>Overview</h2><p class="body">Emsworth makes terry cotton essentials like towels and bath linens. In the US this is a crowded category where most products look alike, so winning depends on positioning, trust and being easy to find.</p></div>
<div class="blk rv" id="role"><h2>Our role</h2><p class="body">We were Emsworth&#x27;s US market entry and growth partner, building a foundation for growth both on its own website and on marketplaces.</p></div>
<div class="blk" id="challenges"><h2 class="rv">Challenges</h2><ul class="chal"><li><i aria-hidden="true">!</i><span>A crowded market where products barely differ</span></li><li><i aria-hidden="true">!</i><span>No positioning beyond price</span></li><li><i aria-hidden="true">!</i><span>Marketplaces dominate, so the brand owned few customer relationships</span></li><li><i aria-hidden="true">!</i><span>Hard to find for shoppers who search without a brand name</span></li><li><i aria-hidden="true">!</i><span>No plan for which products and channels to start with</span></li></ul></div>
<div class="blk" id="solutions"><h2 class="rv">What we did</h2><ol class="sol"><li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Positioned the brand on quality: absorbency, durability and comfort</span></li><li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Chose the products with the most US demand to lead with</span></li><li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Set up growth through two channels at once: marketplaces and its own store</span></li><li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Mapped what ready-to-buy shoppers search for</span></li><li><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Improved product content and presentation to build trust and lift sales</span></li></ol></div>
<div class="blk" id="impact"><h2 class="rv">Impact</h2><div class="imp rv"><p>Emsworth went from a product-led business to a market-ready brand that can compete in a crowded US category.</p></div></div>
</div>

rket and scale.":"Nous avons été son partenaire d'expansion et de croissance aux États-Unis, en posant les bases nécessaires pour entrer sur le marché et grandir.","No clear positioning for American customers":"Pas de positionnement clair pour les clients américains","No clear sense of which dishes to lead with":"Aucune idée claire des plats à mettre en avant","Few people found the brand unless they already knew it":"Peu de gens trouvaient la marque sans la connaître déjà","Too dependent on delivery apps":"Trop dépendante des applis de livraison","No step-by-step plan for launching":"Pas de plan de lancement étape par étape","Repositioned the brand as quick, craveable street food":"Repositionnement de la marque en street food rapide et irrésistible","Mapped demand and chose which menu items to lead with":"Cartographie de la demande et choix des plats phares","Built a plan for being found through search":"Plan pour être trouvée via la recherche","Designed a way to win customers directly, not only through delivery apps":"Méthode pour gagner des clients en direct, pas seulement via les applis de livraison","Planned a pilot-first launch to test before scaling":"Lancement pilote pour tester avant de passer à l'échelle","The Indian Tapas went from a business tied to one location to a demand-driven brand ready to grow in the US.":"The Indian Tapas est passée d'une activité liée à un seul lieu à une marque guidée par la demande, prête à grandir aux États-Unis.","Emsworth makes terry cotton essentials like towels and bath linens. In the US this is a crowded category where most products look alike, so winning depends on positioning, trust and being easy to find.":"Emsworth fabrique des essentiels en éponge de coton, comme des serviettes et du linge de bain. Aux États-Unis, c'est une catégorie saturée où les produits se ressemblent : tout se joue sur le positionnement, la confiance et la visibilité.","We were Emsworth's US market entry and growth partner, building a foundation for growth both on its own website and on marketplaces.":"Nous avons été le partenaire d'entrée sur le marché et de croissance d'Emsworth aux États-Unis, en posant les bases d'une croissance sur son propre site comme sur les marketplaces.","A crowded market where products barely differ":"Un marché saturé où les produits se distinguent à peine","No positioning beyond price":"Aucun positionnement au-delà du prix","Marketplaces dominate, so the brand owned few customer relationships":"Les marketplaces dominent, la marque avait donc peu de relations clients en propre","Hard to find for shoppers who search without a brand name":"Difficile à trouver pour qui cherche sans nom de marque","No plan for which products and channels to start with":"Aucun plan sur les produits et canaux par lesquels commencer","Positioned the brand on quality: absorbency, durability and comfort":"Positionnement de la marque sur la qualité : absorption, durabilité et confort","Chose the products with the most US demand to lead with":"Choix des produits les plus demandés aux États-Unis comme produits phares","Set up growth through two channels at once: marketplaces and its own store":"Croissance sur deux canaux à la fois : marketplaces et boutique en propre","Mapped what ready-to-buy shoppers search for":"Cartographie de ce que recherchent les acheteurs prêts à acheter","Improved product content and presentation to build trust and lift sales":"Amélioration des contenus et de la présentation produit pour inspirer confiance et vendre plus","Emsworth went from a product-led business to a market-ready brand that can compete in a crowded US category.":"Emsworth est passée d'une entreprise centrée sur le produit à une marque prête pour le marché, capable de rivaliser dans une catégorie américaine saturée.","Flavor Atlas is a premium brand selling exotic fruits and vegetables sourced from around the world. To enter the US it needed more than great produce: clear positioning, a focus on the right categories, and a distribution plan for a competitive, logistics-heavy market.":"Flavor Atlas est une marque premium de fruits et légumes exotiques venus du monde entier. Pour entrer aux États-Unis, il fallait plus que de bons produits : un positionnement clair, une priorité aux bonnes catégories et un plan de distribution pour un marché concurrentiel et très logistique.","We were Flavor Atlas's US market entry and growth partner, building a foundation for its products, positioning and distribution.":"Nous avons été le partenaire d'entrée et de croissance de Flavor Atlas aux États-Unis, en posant les bases de ses produits, de son positionnement et de sa distribution.","A competitive produce market where quality is everything":"Un marché des produits frais concurrentiel où la qualité fait tout","No clear positioning for exotic produce":"Pas de positionnement clair pour les produits exotiques","Complex distribution across stores and online":"Distribution complexe entre magasins et en ligne","Little brand awareness in the US":"Peu de notoriété aux États-Unis","No plan for what to prioritize and how to scale":"Aucun plan sur les priorités et la montée en puissance","Positioned the brand as premium and health-led":"Positionnement premium axé sur la santé","Focused on high-demand categories like avocados, berries and specialty greens":"Priorité aux catégories très demandées comme l'avocat, les baies et les légumes verts de spécialité","Built distribution across retail, online grocery and its own store":"Distribution en magasins, en épicerie en ligne et dans sa propre boutique","Mapped what health-minded shoppers are looking for":"Cartographie des attentes des consommateurs soucieux de leur santé","Planned a phased launch, from a pilot to full scale":"Lancement par étapes, du pilote au plein déploiement","Flavor Atlas went from a global sourcing brand to a premium produce player ready for the US, with a clear entry plan and room to grow.":"Flavor Atlas est passée d'une marque d'approvisionnement mondial à un acteur premium prêt pour les États-Unis, avec un plan d'entrée clair et de la marge pour grandir.","Karma is a fashion-forward clothing brand that manufactures in Bangladesh and sells mainly in the US. It already produced efficiently and had an emerging brand. The goal was to grow in a very competitive US fashion market without giving up quality or margin.":"Karma est une marque de vêtements tendance qui fabrique au Bangladesh et vend principalement aux États-Unis. Elle produisait déjà efficacement et avait une marque émergente. L'objectif : grandir sur un marché de la mode américain très concurrentiel sans sacrifier la qualité ni la marge.","We were Karma's growth advisor: helping more people find the brand beyond those already searching for it, and building a way to win customers that keeps working as it scales.":"Nous avons été le conseiller croissance de Karma : aider davantage de personnes à découvrir la marque au-delà de celles qui la cherchaient déjà, et bâtir une méthode d'acquisition qui fonctionne à grande échelle.","No clear positioning for the competitive US fashion market":"Pas de positionnement clair sur le marché de la mode américain, très concurrentiel","Most visitors already knew the brand or came from low-intent channels":"La plupart des visiteurs connaissaient déjà la marque ou venaient de canaux peu qualifiés","Heavy reliance on paid ads made each new customer expensive":"La forte dépendance à la publicité rendait chaque nouveau client coûteux","Product strengths weren't coming through in US-focused messaging":"Les atouts produits ne ressortaient pas dans les messages destinés aux États-Unis","Analyzed the market and competitors to find gaps in pricing, positioning and categories":"Analyse du marché et de la concurrence pour trouver des opportunités de prix, de positionnement et de catégories","Sharpened messaging around quality, affordability and style":"Messages affûtés autour de la qualité, du prix accessible et du style","Built a search strategy around what ready-to-buy shoppers type into Google":"Stratégie de recherche fondée sur ce que tapent dans Google les acheteurs prêts à acheter","Improved product and collection pages, and launched new pages built for search":"Amélioration des pages produits et collections, et lancement de nouvelles pages pensées pour la recherche","Used customer and social insights to create content that earns more clicks and sales":"Contenus créés à partir d'insights clients et sociaux pour générer plus de clics et de ventes","Tailored search work to how and where Americans shop":"Référencement adapté à la façon dont les Américains achètent, et où","Karma now has a stronger base for US growth: more people find it, it relies less on paid ads, and its production strengths now show up as clear value for customers.":"Karma dispose désormais d'une base plus solide pour grandir aux États-Unis : plus de gens la trouvent, elle dépend moins de la publicité, et ses atouts de production se traduisent en valeur claire pour les clients.","Kashida Layone is a modern art brand led by a single artist who wants to make original artwork accessible beyond traditional collectors. The work already had a loyal audience. The opportunity was to build the right setup to grow in the US.":"Kashida Layone est une marque d'art moderne portée par une seule artiste, qui veut rendre les œuvres originales accessibles au-delà des collectionneurs traditionnels. Son travail avait déjà un public fidèle. L'enjeu : bâtir la bonne structure pour grandir aux États-Unis.","We were the artist's US market entry and growth partner, taking care of the business side so the artist could stay focused on making art.":"Nous avons été son partenaire d'entrée et de croissance aux États-Unis, en prenant en charge la partie business pour que l'artiste puisse se concentrer sur son art.","No online store for US buyers":"Pas de boutique en ligne pour les acheteurs américains","Little knowledge of US art buyers and competitors":"Peu de connaissance des acheteurs d'art et des concurrents américains","Needed a clear plan for selling high-value pieces ($1,800 to $2,925)":"Besoin d'un plan clair pour vendre des œuvres de valeur (1 800 à 2 925 $)","Built a Shopify store for US buyers, with well-organized listings, collections and checkout":"Création d'une boutique Shopify pour les acheteurs américains, avec fiches, collections et paiement bien organisés","Researched the market and competitors to map pricing, positioning and gaps":"Étude du marché et de la concurrence pour cartographier prix, positionnement et opportunités","Created a clear US launch plan aimed at the right buyers and channels":"Plan de lancement américain clair, ciblant les bons acheteurs et canaux","Kashida Layone went from a creator-led project to a market-ready business with a strong US online store and a plan to grow.":"Kashida Layone est passée d'un projet d'artiste à une entreprise prête pour le marché, avec une boutique en ligne américaine solide et un plan de croissance.","TanRom Lifesciences makes gummy supplements for sleep, immunity and daily health. The brand was doing well in India, but entering the US meant building for a market where trust matters and the rules are strict.":"TanRom Lifesciences fabrique des compléments en gommes pour le sommeil, l'immunité et la santé au quotidien. La marque marchait bien en Inde, mais entrer aux États-Unis voulait dire s'adapter à un marché où la confiance compte et où les règles sont strictes.","We were the brand's US expansion partner, handling the operational, strategic and commercial groundwork it needed to launch and grow.":"Nous avons été son partenaire d'expansion aux États-Unis, en prenant en charge le travail opérationnel, stratégique et commercial nécessaire pour se lancer et grandir.","No US presence, store or setup":"Aucune présence, boutique ni structure aux États-Unis","A crowded supplement category where trust decides sales":"Une catégorie de U.","Sales channels running":"Canales de venta activos","Vybd Lab · In development":"Vybd Lab · En desarrollo","Vybd runs complete US launches today. Behind that work, we're building tools that make each launch smarter than the one before. The Lab is where we share them, openly, while they're still being built.":"Vybd hace hoy lanzamientos completos en EE. UU. Detrás de ese trabajo, creamos herramientas que hacen cada lanzamiento más inteligente que el anterior. El Lab es donde las compartimos, abiertamente, mientras aún las construimos.","See Brand Brain":"Ver Brand Brain","· prototype":"· prototipo","Voice":"Voz","Operations":"Operaciones","Market":"Mercado","reads voice":"lee la voz","— reads voice":"— lee la voz","reads HTS codes":"lee los códigos HTS","— reads HTS codes":"— lee los códigos HTS","writes finding":"escribe un hallazgo","— writes finding":"— escribe un hallazgo","reads routing":"lee las rutas","— reads routing":"— lee las rutas","writes result":"escribe un resultado","— writes result":"— escribe un resultado","Read":"Lectura","Write":"Escritura","Market Intel":"Intel. de mercado","/ Brand Brain":"/ Brand Brain","One brain per brand.":"Un cerebro por marca.","Every agent acts on it.":"Cada agente actúa con él.","Brand Brain is one shared memory for each brand. Every Vybd AI agent reads from it and adds to it, so they all work from the same facts about your brand, and get smarter with every launch.":"Brand Brain es una memoria compartida para cada marca. Cada agente de IA de Vybd la consulta y la amplía, así todos trabajan con los mismos datos sobre tu marca y mejoran con cada lanzamiento.","core":"núcleo","Your brand guidelines, how you want to be seen, and what to say and not say.":"Tus pautas de marca, cómo quieres que te vean y qué decir y qué no.","So listings, ads and customer replies all sound like you, without anyone re-explaining your brand each time.":"Así, fichas, anuncios y respuestas a clientes suenan como tú, sin tener que volver a explicar tu marca cada vez.","Your products, margins, customs codes, supplier terms, sales-channel rules and compliance limits.":"Tus productos, márgenes, códigos aduaneros, condiciones de proveedores, reglas de canales y límites de cumplimiento.","So agents make the right call (what to reorder, how to classify a product, where to ship it) without stopping to ask.":"Así los agentes deciden bien (qué reponer, cómo clasificar un producto, adónde enviarlo) sin tener que preguntar.","What our research agents learn about the US market and your customers.":"Lo que nuestros agentes de investigación aprenden sobre el mercado de EE. UU. y tus clientes.","So your plan changes when the market does, instead of sticking to day-one guesses.":"Así tu plan cambia cuando cambia el mercado, en lugar de quedarse en las suposiciones del primer día.","/ Why it's a brain, not a config file":"/ Por qué es un cerebro y no un archivo de configuración","Agents don't just read it.":"Los agentes no solo lo leen.","They write back to it.":"También escriben en él.","If agents could only read it, it would just be a settings page. Brand Brain is different: agents also write what they learn back into it.":"Si los agentes solo pudieran leerlo, sería una simple página de ajustes. Brand Brain es distinto: los agentes también escriben en él lo que aprenden.","Market Intelligence":"Inteligencia de mercado","Warehousing":"Almacenaje","E-commerce":"E-commerce","Writes a finding back":"Escribe un hallazgo","Reads the updated brain":"Lee el cerebro actualizado","Write-back":"Escritura","Write-back {n} / 3":"Escritura {n} / 3","Market research changes who the marketing agent targets.":"El estudio de mercado cambia a quién se dirige el agente de marketing.","A customs decision changes how the next shipment gets cleared.":"Una decisión aduanera cambia cómo se despacha el siguiente envío.","A campaign result updates the plan.":"El resultado de una campaña actualiza el plan.","writes → Brand Brain →":"escribe → Brand Brain →","reads":"lee","Every agent":"Todos los agentes","Each launch makes the brain sharper for the next one. By month five it knows far more than it did in month one, and a brand's second market starts ahead of its first.":"Cada lanzamiento afina el cerebro para el siguiente. En el quinto mes sabe mucho más que en el primero, y el segundo mercado de una marca empieza con ventaja.","Month 1":"Mes 1","Month 5":"Mes 5","Status":"Estado","Where this":"Dónde está","actually is.":"realmente esto.","Brand Brain is still being built, so you can't buy it yet. It's where Vybd is heading, shaped by the real launches we run today. We're sharing it early because the people who find this interesting are often the people we want to talk to.":"Brand Brain aún está en construcción, así que todavía no se puede comprar. Es hacia donde va Vybd, moldeado por los lanzamientos reales que hacemos hoy. Lo compartimos pronto porque quienes lo encuentran interesante suelen ser las personas con las que queremos hablar.","Build it with us":"Constrúyelo con nosotros","Full US launches":"Lanzamientos completos en EE. UU.","Running today":"Disponible hoy","In active development":"En desarrollo activo","Available to buy":"Disponible para comprar","Not yet":"Todavía no","How Vybd works":"Cómo funciona Vybd","We run your US business as one connected system. Each part does its own job, and a central layer keeps them all in step, so nothing gets lost between suppliers.":"Gestionamos tu negocio en EE. UU. como un único sistema conectado. Cada parte hace su trabajo y una capa central las mantiene sincronizadas, para que nada se pierda entre proveedores.","See the three layers":"Ver las tres capas","Layer 1":"Capa 1","Layer 2":"Capa 2","Layer 3":"Capa 3","Intelligence":"Inteligencia","Orchestration":"Orquestación","Execution":"Ejecución","/ Architecture":"/ Arquitectura","Three layers.":"Tres capas.","One outcome.":"Un solo resultado.","Every Vybd launch runs on the same three layers. One watches, on :"Productos premium","Fashion and apparel":"Moda y ropa","Art and e-commerce":"Arte y e-commerce","Health supplements":"Suplementos de salud","The Indian Tapas is a modern Indian street food brand that people already love. To expand into the US, it needed new positioning, a clear picture of demand, and a step-by-step plan for going to market.":"The Indian Tapas es una marca moderna de comida callejera india que la gente ya adora. Para expandirse a EE. UU., necesitaba un nuevo posicionamiento, una idea clara de la demanda y un plan paso a paso para salir al mercado.","We were the brand's US expansion and growth partner, building the foundation it needed to enter the market and scale.":"Fuimos su socio de expansión y crecimiento en EE. UU., construyendo la base que necesitaba para entrar en el mercado y escalar.","No clear positioning for American customers":"Sin un posicionamiento claro para clientes estadounidenses","No clear sense of which dishes to lead with":"Sin claridad sobre qué platos destacar","Few people found the brand unless they already knew it":"Poca gente encontraba la marca si no la conocía ya","Too dependent on delivery apps":"Demasiada dependencia de las apps de reparto","No step-by-step plan for launching":"Sin un plan de lanzamiento paso a paso","Repositioned the brand as quick, craveable street food":"Reposicionamos la marca como comida callejera rápida y antojable","Mapped demand and chose which menu items to lead with":"Mapeamos la demanda y elegimos los platos principales","Built a plan for being found through search":"Creamos un plan para que la encuentren por búsqueda","Designed a way to win customers directly, not only through delivery apps":"Diseñamos una forma de ganar clientes directamente, no solo por apps de reparto","Planned a pilot-first launch to test before scaling":"Planificamos un lanzamiento piloto para probar antes de escalar","The Indian Tapas went from a business tied to one location to a demand-driven brand ready to grow in the US.":"The Indian Tapas pasó de ser un negocio ligado a un solo local a una marca impulsada por la demanda, lista para crecer en EE. UU.","Emsworth makes terry cotton essentials like towels and bath linens. In the US this is a crowded category where most products look alike, so winning depends on positioning, trust and being easy to find.":"Emsworth fabrica básicos de rizo de algodón como toallas y ropa de baño. En EE. UU. es una categoría saturada donde casi todo se parece, así que ganar depende del posicionamiento, la confianza y que te encuentren fácilmente.","We were Emsworth's US market entry and growth partner, building a foundation for growth both on its own website and on marketplaces.":"Fuimos el socio de entrada y crecimiento de Emsworth en EE. UU., construyendo una base para crecer tanto en su propia web como en marketplaces.","A crowded market where products barely differ":"Un mercado saturado donde los productos apenas se diferencian","No positioning beyond price":"Sin posicionamiento más allá del precio","Marketplaces dominate, so the brand owned few customer relationships":"Dominan los marketplaces, así que la marca tenía pocas relaciones propias con clientes","Hard to find for shoppers who search without a brand name":"Difícil de encontrar para quien busca sin un nombre de marca","No plan for which products and channels to start with":"Sin un plan de con qué productos y canales empezar","Positioned the brand on quality: absorbency, durability and comfort":"Posicionamos la marca en la calidad: absorción, durabilidad y comodidad","Chose the products with the most US demand to lead with":"Elegimos para empezar los productos con más demanda en EE. UU.","Set up growth through two channels at once: marketplaces and its own store":"Crecimiento por dos canales a la vez: marketplaces y tienda propia","Mapped what ready-to-buy shoppers search for":"Mapeamos lo que buscan los compradores listos para comprar","Improved product content and presentation to build trust and lift sales":"Mejoramos el contenido y la presentación de producto para generar confianza y vender más","Emsworth went from a product-led business to a market-ready brand that can compete in a crowded US category.":"Emsworth pasó de ser un negocio centrado en el producto a una marca lista para el mercado, capaz de competir en una categoría saturada de EE. UU.","Flavor Atlas is a premium brand selling exotic fruits and vegetables sourced from around the world. To enter the US it needed more than great produce: clear positioning, a focus on the right categories, and a distribution plan for a competitive, logistics-heavy market.":"Flavor Atlas es una marca premium de frutas y verduras exóticas de todo el mundo. Para entrar en EE. UU. necesitaba algo más que buen producto: un posicionamiento claro, foco en las categorías adecuadas y un plan de distribución para un mercado competitivo y muy logístico.","We were Flavor Atlas's US market entry and growth partner, building a foundation for its products, positioning and distribution.":"Fuimos el socio de entrada y crecimiento de Flavor Atlas en EE. UU., construyendo la base de sus productos, posicionamiento y distribución.","A competitive produce market where quality is everything":"Un mercado de frescos competitivo donde la calidad lo es todo","No clear positioning for exotic produce":"Sin posicionamiento claro para productos exóticos","Complex distribution across stores and online":"Distribución compleja entre tiendas y online","Little brand awareness in the US":"Poca notoriedad de marca en EE. UU.","No plan for what to prioritize and how to scale":"Sin un plan de prioridades ni de cómo escalar","Positioned the brand as premium and health-led":"Posicionamos la marca como premium y centrada en la salud","Focused on high-demand categories like avocados, berries and specialty greens":"Nos centramos en categorías con mucha demanda como aguacates, frutos rojos y verduras especiales","Built distribution across retail, online grocery and its own store":"Creamos distribución en tiendas, supermercados online y su propia tienda","Mapped what health-minded shoppers are looking for":"Mapeamos lo que buscan los compradores preocupados por la salud","Planned a phased launch, from a pilot to full scale":"Planificamos un lanzamiento por fases, del piloto a la escala completa","Flavor Atlas went from a global sourcing brand to a premium produce player ready for the US, with a clear entry plan and room to grow.":"Flavor Atlas pasó de ser una marca de abastecimiento global a un actor premium listo para EE. UU., con un plan de entrada claro y margen para crecer.","Karma is a fashion-forward clothing brand that manufactures in Bangladesh and sells mainly in the US. It already produced efficiently and had an emerging brand. The goal was to grow in a very competitive US fashion market without giving up quality or margin.":"Karma es una marca de ropa a la moda que fabrica en Bangladés y vende sobre todo en EE. UU. Ya producía de forma eficiente y tenía una marca emergente. El objetivo era crecer en un mercado de moda estadounidense muy competitivo sin renunciar a la calidad ni al margen.","We were Karma's growth advisor: helping more people find the brand beyond those already searching for it, and building a way to win customers that keeps working as it scales.":"Fuimos el asesor de crecimiento de Karma: ayudar a que más gente encontrara la marca, más allá de quienes ya la buscaban, y crear una forma de ganar clientes que siga funcionando al crecer.","No clear positioning for the competitive US fashion market":"Sin posicionamiento claro para el competitivo mercado de moda de EE. UU.","Most visitors already knew the brand or came from low-intent channels":"La mayoría de las visitas ya conocían la marca o venían de canales de baja intención","Heavy reliance on paid ads made each new customer expensive":"Depender tanto de los anuncios encarecía cada nuevo cliente","Product strengths weren't coming t
