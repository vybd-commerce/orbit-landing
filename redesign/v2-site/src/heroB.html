<!-- 1 HERO (design B): parcels ride four lanes into one US operation, orders leave on three -->
<section class="hero3" data-loc="hero">
  <div class="frame hero3-in">
    <div class="hero3-copy">
      <span class="tag" data-rv>{{TAG}}</span>
      <h1 class="h1" data-split>{{H1}}</h1>
    </div>
    <div class="hero3-side">
      <p class="lead" data-rv data-delay="350">{{LEAD}}</p>
      <div class="links" data-rv data-delay="500">{{LINKS}}</div>
    </div>
  </div>
  <div class="frame">
    <div class="flow pre" id="flow" aria-hidden="true">
      <svg class="flow-svg" viewBox="0 0 1200 380" preserveAspectRatio="none">
        <g class="lanes-in">
          <path id="fi0" d="M210 60 C 380 60, 400 190, 520 190"/>
          <path id="fi1" d="M210 145 C 360 145, 400 190, 520 190"/>
          <path id="fi2" d="M210 235 C 360 235, 400 190, 520 190"/>
          <path id="fi3" d="M210 320 C 380 320, 400 190, 520 190"/>
        </g>
        <g class="lanes-out">
          <path id="fo0" d="M680 190 C 800 190, 830 80, 960 80"/>
          <path id="fo1" d="M680 190 L 960 190"/>
          <path id="fo2" d="M680 190 C 800 190, 830 300, 960 300"/>
        </g>
        <g id="fpk"></g>
      </svg>
      <div class="dock" style="--y:15.8%"><i>CN</i><b>China</b><small>Factory</small></div>
      <div class="dock" style="--y:38.2%"><i>KR</i><b>South Korea</b><small>Brand</small></div>
      <div class="dock" style="--y:61.8%"><i>FR</i><b>France</b><small>Brand</small></div>
      <div class="dock" style="--y:84.2%"><i>IN</i><b>India</b><small>Manufacturer</small></div>
      <div class="crate"><div class="ping" id="fping"></div><div class="box"><div class="lbl">US OPERATION<b>America</b><s></s></div></div></div>
      <div class="dest" style="--y:21%"><i></i>Warehouse</div>
      <div class="dest" style="--y:50%"><i></i>Sales channels</div>
      <div class="dest" style="--y:79%"><i></i>Customers</div>
      <p class="flow-k in">Your stock</p><p class="flow-k out">US orders</p>
    </div>
  </div>
</section>
